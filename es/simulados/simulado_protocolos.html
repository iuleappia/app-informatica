<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protocolos de Red</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;}
body{background:linear-gradient(135deg,#4CAF50,#2E7D32);min-height:100vh;display:flex;justify-content:center;align-items:center;}
#main-wrapper{width:95%;max-width:650px;}
#quiz-container{background:#fff;padding:25px;border-radius:16px;box-shadow:0 15px 40px rgba(0,0,0,0.2);text-align:center;animation:fadeIn .4s;}
h2{margin-bottom:10px;color:#2E7D32;}
#progress-text{margin-bottom:10px;font-size:14px;color:#555;}
#progress-bar{width:100%;height:10px;background:#ddd;border-radius:20px;overflow:hidden;margin-bottom:20px;}
#progress{height:100%;width:0%;background:#4CAF50;transition:.3s;}
#question-container{font-weight:bold;margin-bottom:20px;}
#options-container{display:grid;grid-template-columns:1fr;gap:10px;}
.option{width:100%;background:#4CAF50;color:#fff;padding:14px;border:none;border-radius:8px;cursor:pointer;transition:.3s;font-size:16px;}
.option:hover{background:#388E3C;transform:scale(1.02);}
.option:disabled{opacity:.7;cursor:not-allowed;}
.correct{background:#2E7D32!important;}
.wrong{background:#C62828!important;}
#result{margin-top:15px;font-weight:bold;}
#restart-btn{margin-top:20px;padding:12px 20px;border:none;background:#2E7D32;color:white;border-radius:8px;cursor:pointer;font-size:16px;display:none;}
#restart-btn:hover{background:#1B5E20;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@media(min-width:600px){#options-container{grid-template-columns:1fr 1fr;}}

/* === MELHORIAS: feedback, próxima, voltar === */
.btn-voltar{display:inline-block;margin-bottom:12px;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;padding:10px 14px;border-radius:8px;background:rgba(255,255,255,0.18);}
.btn-voltar:hover{background:rgba(255,255,255,0.3);}
body{align-items:flex-start!important;}
#main-wrapper{margin:auto;padding:16px 0;}
.option:disabled{transform:none;}
.option:disabled:not(.correct):not(.wrong){background:#b0b7b0;}
.option.correct:disabled,.option.wrong:disabled{opacity:1;}
.option.correct:disabled::before{content:"✔ ";}
.option.wrong:disabled::before{content:"✖ ";}
#question-container{line-height:1.4;}
#feedback{display:none;margin-top:16px;text-align:left;border-radius:10px;padding:14px 16px;font-size:15px;line-height:1.5;animation:fadeIn .3s;}
#feedback.ok{display:block;background:#e8f5e9;border-left:5px solid #2E7D32;}
#feedback.erro{display:block;background:#ffebee;border-left:5px solid #C62828;}
#feedback .fb-titulo{font-weight:bold;margin-bottom:6px;color:#222;}
#feedback .fb-texto{color:#444;}
#next-btn{display:none;margin-top:14px;width:100%;padding:13px;border:none;border-radius:8px;background:#1565C0;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;}
#next-btn:hover{background:#0D47A1;}
#result .msg{display:block;margin-top:8px;font-weight:normal;color:#444;}
#result .btn-revisar{display:block;margin:16px auto 0;max-width:320px;padding:12px;border-radius:8px;background:#f59e0b;color:#fff;text-decoration:none;font-weight:bold;}
#result .best{display:block;margin-top:6px;font-size:13px;font-weight:normal;color:#777;}

</style>
<script src="../../js/estudo.js"></script>
<link rel="stylesheet" href="../../css/escuro.css">
<script src="../../js/tema.js"></script>
</head>
<body>
<div id="main-wrapper">

<a href="../simulados.html" class="btn-voltar" onclick="if(history.length>1){history.back();return false;}">← Volver</a>

<div id="quiz-container">
<h2>Protocolos de Red</h2>
<div id="progress-text"></div>
<div id="progress-bar"><div id="progress"></div></div>
<div id="question-container"></div>
<div id="options-container"></div>

<div id="feedback"></div>

<button id="next-btn"></button>
<p id="result"></p>
<button id="restart-btn">Repetir Simulacro</button>
</div>
</div>
<script>
const questions = [
  {
    question: "¿Qué significa la sigla TCP en protocolos de red?",
    options: ["Transmission Control Protocol","Time Clock Protocol","Terminal Connection Protocol","Text Compression Protocol"],
    correctAnswer: 0,
    explanation: "TCP = Transmission Control Protocol. Garantiza una entrega confiable y en orden, con confirmación y retransmisión de paquetes."
  },
  {
    question: "¿Cuál es la función principal del protocolo IP en una red?",
    options: ["Control de tráfico","Enrutamiento de datos","Compresión de datos","Cifrado de datos"],
    correctAnswer: 1,
    explanation: "IP (Internet Protocol) direcciona y encamina los paquetes del origen al destino, pasando por varias redes."
  },
  {
    question: "¿Qué es una dirección MAC en redes de computadoras?",
    options: ["Máscara de Acceso Controlado","Módulo de Acceso Central","Media Access Control","Modulación de Acceso a la Conexión"],
    correctAnswer: 2,
    explanation: "MAC = Media Access Control. Es la dirección física grabada en la tarjeta de red, de 48 bits (ej.: 00:1A:2B:3C:4D:5E)."
  },
  {
    question: "¿Cuál es la diferencia entre TCP y UDP?",
    options: ["TCP está orientado a la conexión, UDP no lo está","TCP es más rápido que UDP","UDP está orientado a la conexión, TCP no lo está","TCP y UDP son idénticos en funcionalidad"],
    correctAnswer: 0,
    explanation: "TCP está orientado a la conexión (handshake, confirmación, retransmisión). UDP no establece conexión: es más rápido, pero sin garantía de entrega."
  },
  {
    question: "¿Qué es un protocolo de enrutamiento en redes?",
    options: ["Un protocolo que permite a los enrutadores intercambiar rutas entre sí","Un protocolo para controlar el tráfico de datos","Un protocolo para enviar y recibir correos","Un protocolo para gestionar direcciones IP"],
    correctAnswer: 0,
    explanation: "Los protocolos de enrutamiento (RIP, OSPF, BGP) permiten que los routers intercambien información y armen automáticamente sus tablas de rutas."
  },
  {
    question: "¿Cuál es la finalidad del protocolo DNS?",
    options: ["Enrutamiento de paquetes","Resolución de nombres a direcciones IP","Control de calidad de servicio","Transferencia de archivos"],
    correctAnswer: 1,
    explanation: "El DNS traduce nombres de dominio (www.google.com) a direcciones IP, que es lo que realmente usan las computadoras."
  },
  {
    question: "¿Qué es el protocolo DHCP y cuál es su función?",
    options: ["Protocolo de Control Dinámico de Hosts, responsable de la seguridad de la red","Protocolo de Configuración Dinámica de Hosts, responsable de la asignación automática de direcciones IP","Protocolo de Enrutamiento Dinámico, responsable de la gestión de rutas en la red","Protocolo de Seguridad de Conexión Dinámica, responsable del cifrado de datos"],
    correctAnswer: 1,
    explanation: "DHCP = Dynamic Host Configuration Protocol. Asigna automáticamente IP, máscara, puerta de enlace y DNS a los dispositivos de la red."
  },
  {
    question: "¿Qué es NAT en redes de computadoras?",
    options: ["New Address Translation","Network Address Translation","Node Access Technology","National Authentication Token"],
    correctAnswer: 1,
    explanation: "NAT = Network Address Translation. Traduce las IP privadas de la red interna a una IP pública al salir a internet."
  },
  {
    question: "¿Qué es un firewall en términos de redes de computadoras?",
    options: ["Un dispositivo para amplificar la señal de red","Una barrera física que protege los servidores","Un software o hardware que impide o permite el tráfico de datos","Una herramienta para monitorear el ancho de banda de la red"],
    correctAnswer: 2,
    explanation: "El firewall (software o hardware) analiza el tráfico y permite o bloquea conexiones según reglas de seguridad."
  },
  {
    question: "¿Cuál es la función principal del protocolo ARP?",
    options: ["Enrutamiento de paquetes","Resolución de direcciones IP a nombres","Resolución de direcciones IP a direcciones MAC","Control de congestión de red"],
    correctAnswer: 2,
    explanation: "ARP (Address Resolution Protocol) descubre la dirección MAC que corresponde a una IP conocida en la red local."
  },
  {
    question: "¿Qué es un protocolo de tunelización?",
    options: ["Un protocolo para crear túneles en redes subterráneas","Un protocolo para encapsular un protocolo dentro de otro para transmisión a través de una red","Un protocolo para crear redes privadas virtuales","Un protocolo para aumentar el ancho de banda de la red"],
    correctAnswer: 1,
    explanation: "La tunelización encapsula un protocolo dentro de otro para atravesar una red; es la base de las VPN (ej.: GRE, L2TP, IPsec)."
  },
  {
    question: "¿Qué significa QoS en redes?",
    options: ["Quality of Service","Quick Online Support","Quantum Operating System","Query of Standards"],
    correctAnswer: 0,
    explanation: "QoS = Quality of Service. Prioriza ciertos tipos de tráfico (voz, video) para garantizar calidad y menor retraso."
  },
  {
    question: "¿Cuál es la diferencia entre un switch y un hub en una red local?",
    options: ["Ambos son dispositivos idénticos","Un switch filtra el tráfico de red, mientras que un hub no lo hace","Un hub es más rápido que un switch","Un switch solo admite conexiones inalámbricas"],
    correctAnswer: 1,
    explanation: "El hub repite los datos a todos los puertos. El switch aprende las direcciones MAC y envía los datos solo al puerto de destino."
  },
  {
    question: "¿Qué es el protocolo ICMP y para qué se usa?",
    options: ["Internet Control Message Protocol, usado para diagnóstico de red y reportes de error","Internet Communication Management Protocol, usado para gestionar comunicaciones en línea","Integrated Control and Monitoring Protocol, usado para control y monitoreo integrados","Internet Configuration and Management Protocol, usado para configurar dispositivos de red"],
    correctAnswer: 0,
    explanation: "ICMP = Internet Control Message Protocol. Envía mensajes de error y diagnóstico; lo usan los comandos ping y traceroute."
  },
  {
    question: "¿Qué es el protocolo FTP y cuál es su función?",
    options: ["File Transfer Protocol, usado para transmisión de archivos","Fast Transmission Protocol, usado para transferencia rápida de datos","File Tracking Protocol, usado para rastrear cambios en archivos","File Type Protocol, usado para identificar el tipo de archivo"],
    correctAnswer: 0,
    explanation: "FTP = File Transfer Protocol. Transfiere archivos entre cliente y servidor (puertos 20 y 21)."
  },
  {
    question: "¿Qué es el protocolo SSL/TLS y para qué sirve?",
    options: ["Secure Socket Layer/Transport Layer Security, usado para cifrar comunicaciones en la web","Simple Service Locator/Transport Layer Security","System Security Layer/Transmission Level Security","Software Service Locator/Total Link Security"],
    correctAnswer: 0,
    explanation: "SSL/TLS cifra la comunicación entre cliente y servidor. Es la \"S\" de HTTPS (SSL fue reemplazado por TLS)."
  },
  {
    question: "¿Qué es una dirección IPv6 y por qué fue desarrollada?",
    options: ["Una dirección de Internet versión 6 para reemplazar IPv4 debido a la escasez de direcciones","Para mejorar la velocidad de la conexión","Para redes privadas virtuales","Para admitir solo dispositivos inalámbricos"],
    correctAnswer: 0,
    explanation: "IPv6 usa direcciones de 128 bits y se creó porque las direcciones IPv4 (32 bits, unos 4.300 millones) se estaban agotando."
  },
  {
    question: "¿Qué es un ataque DDoS en términos de redes?",
    options: ["Directo y Descentralizado Sobrecargado","Distribución de Datos y Operaciones Seguras","Denegación de Servicio Distribuida","Duplicación de Sesiones y Operaciones Seguras"],
    correctAnswer: 2,
    explanation: "DDoS = Distributed Denial of Service (Denegación de Servicio Distribuida): muchos dispositivos sobrecargan un objetivo hasta dejarlo fuera de servicio."
  },
  {
    question: "¿Qué protocolo se usa para el envío de correos electrónicos?",
    options: ["SMTP","FTP","DNS","ARP"],
    correctAnswer: 0,
    explanation: "SMTP (Simple Mail Transfer Protocol) es el protocolo de envío de correos, entre cliente y servidor y entre servidores."
  },
  {
    question: "¿Qué protocolo se usa para recibir correos electrónicos en clientes de correo?",
    options: ["POP3 o IMAP","HTTP","ICMP","DHCP"],
    correctAnswer: 0,
    explanation: "POP3 descarga los correos al dispositivo. IMAP los sincroniza: quedan en el servidor y se ven iguales en todos los equipos."
  }
];

/* ===== Lógica do simulado =====
   - alternativas e perguntas embaralhadas a cada tentativa
   - explicação após cada resposta + botão de próxima
   - melhor nota salva no aparelho */
const TXT = {"q":"Pregunta","of":"de","ok":"✅ ¡Correcto!","bad":"❌ Incorrecto. Respuesta correcta:","next":"Siguiente pregunta ▶","finish":"Ver resultado 🏁","final":"Resultado final","best":"Tu mejor nota en este simulacro:","m1":"🏆 ¡Excelente! Dominas este contenido.","m2":"👍 ¡Buen resultado! Repasa los puntos que fallaste.","m3":"📚 Sigue estudiando: vuelve a leer la materia e inténtalo de nuevo."};
function scoreText(s, n){ return `Acertaste ${s} de ${n} preguntas (${Math.round(s / n * 100)}%)`; }

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

let quiz=[], currentQuestion=0, score=0;

function prepareQuiz(){
  quiz = shuffle(questions.map(q => {
    const opts = shuffle(q.options.map((text,i) => ({ text, ok: i === q.correctAnswer })));
    return { question:q.question, options:opts.map(o=>o.text), correctAnswer:opts.findIndex(o=>o.ok), explanation:q.explanation };
  }));
  currentQuestion=0; score=0;
}

function loadQuestion(){
  const q = quiz[currentQuestion];
  document.getElementById("progress-text").textContent = TXT.q+" "+(currentQuestion+1)+" "+TXT.of+" "+quiz.length;
  document.getElementById("progress").style.width = (currentQuestion/quiz.length*100)+"%";
  document.getElementById("question-container").textContent = q.question;
  const fb = document.getElementById("feedback"); fb.className=""; fb.innerHTML="";
  document.getElementById("next-btn").style.display="none";
  document.getElementById("result").innerHTML="";
  const box = document.getElementById("options-container");
  box.innerHTML="";
  q.options.forEach((option,index) => {
    const b=document.createElement("button");
    b.textContent=option; b.className="option"; b.dataset.index=index; b.onclick=selectOption;
    box.appendChild(b);
  });
}

function selectOption(event){
  const q = quiz[currentQuestion];
  const buttons=document.querySelectorAll(".option");
  buttons.forEach(b=>b.disabled=true);
  const selected=parseInt(event.currentTarget.dataset.index,10);
  const fb=document.getElementById("feedback");
  let titulo;
  if(selected===q.correctAnswer){
    event.currentTarget.classList.add("correct"); score++; fb.className="ok"; titulo=TXT.ok;
  }else{
    event.currentTarget.classList.add("wrong"); buttons[q.correctAnswer].classList.add("correct"); fb.className="erro";
    titulo=TXT.bad+" "+q.options[q.correctAnswer];
  }
  if(window.Estudo) Estudo.registrarResposta(q, selected===q.correctAnswer);
  fb.innerHTML='<div class="fb-titulo"></div><div class="fb-texto"></div>';
  fb.querySelector(".fb-titulo").textContent=titulo;
  fb.querySelector(".fb-texto").textContent=q.explanation||"";
  const next=document.getElementById("next-btn");
  next.textContent = currentQuestion+1<quiz.length ? TXT.next : TXT.finish;
  next.style.display="block";
  next.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function nextQuestion(){
  currentQuestion++;
  if(currentQuestion<quiz.length){ loadQuestion(); window.scrollTo({top:0,behavior:"smooth"}); }
  else showResult();
}

function showResult(){
  const n=quiz.length, pct=score/n;
  document.getElementById("progress").style.width="100%";
  document.getElementById("progress-text").textContent="";
  document.getElementById("question-container").textContent=TXT.final;
  document.getElementById("options-container").innerHTML="";
  const fb=document.getElementById("feedback"); fb.className=""; fb.innerHTML="";
  document.getElementById("next-btn").style.display="none";
  let best=score;
  if(window.Estudo) best=Estudo.salvarNota(score,n).melhor;
  const r=document.getElementById("result");
  r.innerHTML="";
  const a=document.createElement("span"); a.textContent=scoreText(score,n);
  const m=document.createElement("span"); m.className="msg"; m.textContent= pct>=0.8?TXT.m1 : pct>=0.6?TXT.m2 : TXT.m3;
  const b=document.createElement("span"); b.className="best"; b.textContent=TXT.best+" "+best+"/"+n;
  r.append(a,m,b);
  if(window.Estudo && Estudo.erros().length){
    const rv=document.createElement("a"); rv.href="revisao.html"; rv.className="btn-revisar";
    rv.textContent="📌 Repasar mis errores ("+Estudo.erros().length+")";
    r.appendChild(rv);
  }
  if(window.Estudo) Estudo.oferta(r, pct);
  document.getElementById("restart-btn").style.display="inline-block";
  try{ const g=(typeof gtag==="function")?gtag:(window.parent&&window.parent.gtag); if(g) g("event","simulado_concluido",{simulado:document.title,acertos:score,total:n}); }catch(e){}
}

document.getElementById("next-btn").onclick=nextQuestion;
document.getElementById("restart-btn").onclick=function(){
  this.style.display="none"; prepareQuiz(); loadQuestion();
};

prepareQuiz();
loadQuestion();

</script>
</body>
</html>
