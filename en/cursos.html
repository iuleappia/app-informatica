<meta name="keywords" content="complete computer basics ebook, computer basics, iuleapp">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:#f4f6f8;
text-align:center;
min-height:100vh;
display:flex;
flex-direction:column;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
flex:1;
}

.cards-destaque{
display:grid;
grid-template-columns:repeat(3, 1fr);
gap:20px;
margin-top:20px;
}

.card-produto{
display:flex;
flex-direction:column;
background:white;
border-radius:14px;
overflow:hidden;
box-shadow:0 8px 20px rgba(0,0,0,0.12);
transition:0.2s;
}

.card-produto:hover{
transform:translateY(-5px);
}

.imagem-produto{
position:relative;
}

.imagem-produto img{
width:100%;
height:200px;
object-fit:cover;
}

.badge{
position:absolute;
top:12px;
left:12px;
background:#ff8c00;
color:#fff;
padding:6px 10px;
border-radius:8px;
font-size:13px;
font-weight:bold;
}

.conteudo-produto{
padding:18px;
display:flex;
flex-direction:column;
flex:1;
}

.desc{
font-size:14px;
color:#666;
margin:10px 0;
}

.avaliacao{
color:#f5a623;
margin-bottom:6px;
}

.leitores{
font-size:13px;
color:#555;
margin-bottom:10px;
}

.botoes{
margin-top:auto;
display:flex;
gap:10px;
}

.btn{
flex:1;
padding:12px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
color:#fff;
text-align:center;
}

.btn-info{
background:#1e88e5;
}

.btn-comprar{
background:#2e9e44;
}

.btn:active{
transform:scale(0.96);
}

.footer{
margin-top:20px;
background:#111;
color:#ddd;
padding:40px 20px;
width:100%;
}

.footer-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:30px;
max-width:1200px;
margin:auto;
}

.footer h3{
font-size:16px;
margin-bottom:10px;
color:#fff;
}

.footer p{
font-size:13px;
line-height:1.6;
}

.footer a{
display:block;
color:#ddd;
text-decoration:none;
font-size:13px;
margin-bottom:6px;
}

.footer a:hover{
color:#fff;
}

.footer-bottom{
margin-top:25px;
text-align:center;
font-size:12px;
color:#aaa;
}

@media(max-width:900px){
.cards-destaque{
grid-template-columns:repeat(2, 1fr);
}
.footer-grid{
grid-template-columns:1fr;
}
}

@media(max-width:600px){
.cards-destaque{
grid-template-columns:1fr;
}
}


/* toque confortável no celular */
.footer a{display:block;padding:8px 0;margin-bottom:0;}

/* card simples (sem imagem) — alterna com o card com foto */
.card-simples .conteudo-produto{padding:22px 18px;text-align:left;border-top:5px solid var(--cor,#2f5fd0);}
.card-simples .tag{align-self:flex-start;font-size:11px;font-weight:bold;letter-spacing:.5px;color:var(--cor,#2f5fd0);background:#eef2fb;border-radius:20px;padding:4px 10px;margin-bottom:12px;}
.card-simples h3{font-size:20px;line-height:1.25;}
.card-simples .icone{font-size:34px;margin-bottom:8px;}
.capa-produto{height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;text-align:center;padding:20px;}
.capa-produto .ic{font-size:44px;}
.capa-produto .tt{font-size:22px;font-weight:bold;line-height:1.2;}
.capa-produto .tt span{color:#FFD60A;}
html.escuro .card-simples .tag{background:#1e2a4a;}
</style>
<link rel="stylesheet" href="../css/escuro.css">

</head>

</div>
