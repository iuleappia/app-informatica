<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Software</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:linear-gradient(135deg,#4CAF50,#2E7D32);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

#main-wrapper{
width:95%;
max-width:650px;
}

#quiz-container{
background:#fff;
padding:25px;
border-radius:16px;
box-shadow:0 15px 40px rgba(0,0,0,0.2);
text-align:center;
animation:fadeIn .4s;
}

h2{
margin-bottom:10px;
color:#2E7D32;
}

#progress-text{
margin-bottom:10px;
font-size:14px;
color:#555;
}

#progress-bar{
width:100%;
height:10px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin-bottom:20px;
}

#progress{
height:100%;
width:0%;
background:#4CAF50;
transition:.3s;
}

#question-container{
font-weight:bold;
margin-bottom:20px;
}

#options-container{
display:grid;
grid-template-columns:1fr;
gap:10px;
}

.option{
width:100%;
background:#4CAF50;
color:#fff;
padding:14px;
border:none;
border-radius:8px;
cursor:pointer;
transition:.3s;
font-size:16px;
}

.option:hover{
background:#388E3C;
transform:scale(1.02);
}

.option:disabled{
opacity:.7;
cursor:not-allowed;
}

.correct{
background:#2E7D32!important;
}

.wrong{
background:#C62828!important;
}

#result{
margin-top:15px;
font-weight:bold;
}

#restart-btn{
margin-top:20px;
padding:12px 20px;
border:none;
background:#2E7D32;
color:white;
border-radius:8px;
cursor:pointer;
font-size:16px;
display:none;
}

#restart-btn:hover{
background:#1B5E20;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:translateY(0);}
}

@media(min-width:600px){
#options-container{
grid-template-columns:1fr 1fr;
}
}


/* === MELHORIAS: feedback, próxima, voltar === */
.btn-voltar{display:inline-block;margin-bottom:12px;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;padding:10px 14px;border-radius:8px;background:rgba(255,255,255,0.18);}
.btn-voltar:hover{background:rgba(255,255,255,0.3);}
body{align-items:flex-start!important;}
#main-wrapper{margin:auto;padding:16px 0;}
.option:disabled{transform:none;}
.option:disabled:not(.correct):not(.wrong){background:#b0b7b0;}
.option.correct:disabled,.option.wrong:disabled{opacity:1;}
.option.correct:disabled::before{content:"✔ ";}
.option.wrong:disabled::before{content:"✖ ";}
#question-container{line-height:1.4;}
#feedback{display:none;margin-top:16px;text-align:left;border-radius:10px;padding:14px 16px;font-size:15px;line-height:1.5;animation:fadeIn .3s;}
#feedback.ok{display:block;background:#e8f5e9;border-left:5px solid #2E7D32;}
#feedback.erro{display:block;background:#ffebee;border-left:5px solid #C62828;}
#feedback .fb-titulo{font-weight:bold;margin-bottom:6px;color:#222;}
#feedback .fb-texto{color:#444;}
#next-btn{display:none;margin-top:14px;width:100%;padding:13px;border:none;border-radius:8px;background:#1565C0;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;}
#next-btn:hover{background:#0D47A1;}
#result .msg{display:block;margin-top:8px;font-weight:normal;color:#444;}
#result .btn-revisar{display:block;margin:16px auto 0;max-width:320px;padding:12px;border-radius:8px;background:#f59e0b;color:#fff;text-decoration:none;font-weight:bold;}
#result .best{display:block;margin-top:6px;font-size:13px;font-weight:normal;color:#777;}

</style>
<script src="../js/estudo.js"></script>
<link rel="stylesheet" href="../css/escuro.css">
<script src="../js/tema.js"></script>
</head>

<body>

<div id="main-wrapper">

<a href="../page/simulados.html" class="btn-voltar" onclick="if(history.length>1){history.back();return false;}">← Voltar</a>


<div id="quiz-container">

<h2>Software</h2>

<div id="progress-text"></div>

<div id="progress-bar">
<div id="progress"></div>
</div>

<div id="question-container"></div>

<div id="options-container"></div>

<div id="feedback"></div>

<button id="next-btn"></button>

<p id="result"></p>

<button id="restart-btn">Refazer Simulado</button>

</div>

</div>

<script>

const questions = [
  {
    question: "O que é um software?",
    options: ["Um dispositivo de hardware","Um conjunto de instruções para o computador","Um tipo de armazenamento de dados","Uma interface gráfica"],
    correctAnswer: 1,
    explanation: "Software é a parte lógica do computador: programas e instruções que dizem ao hardware o que fazer."
  },
  {
    question: "Qual é a diferença entre software de código aberto e software proprietário?",
    options: ["O preço de aquisição","O acesso ao código-fonte","A facilidade de uso","A velocidade de processamento"],
    correctAnswer: 1,
    explanation: "No software de código aberto (Linux, LibreOffice) o código-fonte é público. No proprietário (Windows, Office) o código é fechado."
  },
  {
    question: "O que é um sistema operacional?",
    options: ["Um programa antivírus","Um software de edição de texto","Um software que gerencia o hardware e os demais programas","Um software de design gráfico"],
    correctAnswer: 2,
    explanation: "O sistema operacional é o software básico que gerencia o hardware e serve de base para os demais programas (Windows, Linux, Android)."
  },
  {
    question: "Qual é a função de um compilador no desenvolvimento de software?",
    options: ["Executar programas","Converter código-fonte em código de máquina","Criar interfaces gráficas","Detectar vírus no código"],
    correctAnswer: 1,
    explanation: "O compilador traduz todo o código-fonte para código de máquina (ou executável) antes da execução. O interpretador traduz linha a linha."
  },
  {
    question: "O que são linguagens de programação de alto nível?",
    options: ["Linguagens difíceis de aprender","Linguagens que se comunicam com hardware diretamente","Linguagens mais próximas da linguagem humana","Linguagens usadas apenas para jogos"],
    correctAnswer: 2,
    explanation: "Linguagens de alto nível (Python, Java, C#) usam comandos próximos da linguagem humana, mais fáceis de ler e escrever."
  },
  {
    question: "O que significa UX em design de software?",
    options: ["User Experience","User Execution","User Exception","User Expansion"],
    correctAnswer: 0,
    explanation: "UX = User Experience: a experiência do usuário, ou seja, o quanto o software é fácil, agradável e eficiente de usar."
  },
  {
    question: "O que é um banco de dados?",
    options: ["Um dispositivo de armazenamento físico","Um software de edição de imagens","Um conjunto de dados organizados","Uma forma de hardware de comunicação"],
    correctAnswer: 2,
    explanation: "Banco de dados é um conjunto organizado de dados, geralmente gerenciado por um SGBD (MySQL, Oracle, SQL Server)."
  },
  {
    question: "O que são APIs (Interfaces de Programação de Aplicações) em software?",
    options: ["Algoritmos complexos","Módulos de software pré-instalados","Conjuntos de instruções de hardware","Conjuntos de regras para interação entre software"],
    correctAnswer: 3,
    explanation: "APIs definem como softwares diferentes se comunicam e trocam dados entre si."
  },
  {
    question: "O que é debugging em programação?",
    options: ["Um tipo de linguagem de programação","O processo de remover bugs de um programa","Um método de programação rápida","Um tipo de hardware especializado"],
    correctAnswer: 1,
    explanation: "Debugging (depuração) é localizar e corrigir bugs (erros) no código."
  },
  {
    question: "O que é a nuvem (cloud) no contexto de software?",
    options: ["Um tipo de software antivírus","Um tipo de sistema operacional","Um modelo de distribuição de serviços pela internet","Um tipo de armazenamento externo"],
    correctAnswer: 2,
    explanation: "Computação em nuvem oferece servidores, armazenamento e programas pela internet, sob demanda (ex.: Google Drive, AWS)."
  },
  {
    question: "Qual é a diferença entre software e firmware?",
    options: ["Software é armazenado em hardware, firmware em software","Software é de código aberto, firmware é proprietário","Software é facilmente modificável, firmware é difícil de modificar","Software é temporário, firmware é permanente"],
    correctAnswer: 2,
    explanation: "Firmware é um software gravado no próprio hardware (BIOS, roteador) e é difícil de alterar. Software comum é instalado e modificado com facilidade."
  },
  {
    question: "O que é um algoritmo em programação?",
    options: ["Um tipo de hardware","Um conjunto de instruções específicas","Um método de resolução de problemas","Um tipo de interface gráfica"],
    correctAnswer: 2,
    explanation: "Algoritmo é um método, uma sequência de passos para resolver um problema. O programa é a implementação dele em uma linguagem."
  },
  {
    question: "O que significa IoT (Internet of Things) em software?",
    options: ["Internet Offline Transfer","Internet of Telecommunications","Internet of Things","Internet Over Time"],
    correctAnswer: 2,
    explanation: "IoT = Internet of Things (Internet das Coisas): objetos do dia a dia conectados à internet, como lâmpadas, relógios e sensores."
  },
  {
    question: "O que é versionamento de software?",
    options: ["Um método de rastreamento de versões antigas de software","Um tipo de software de edição de vídeo","Um método de desenvolvimento de software","Um processo de controle de mudanças em software"],
    correctAnswer: 3,
    explanation: "O versionamento (Git, por exemplo) registra as mudanças do software ao longo do tempo e permite voltar a versões anteriores."
  },
  {
    question: "O que é criptografia em software?",
    options: ["Um método de compressão de dados","Um tipo de linguagem de programação","Um método de codificação de dados para segurança","Um tipo de algoritmo de inteligência artificial"],
    correctAnswer: 2,
    explanation: "Criptografia codifica os dados para que só quem tem a chave consiga lê-los, protegendo senhas, mensagens e transações."
  },
  {
    question: "O que são frameworks em desenvolvimento de software?",
    options: ["Um tipo de sistema operacional","Um conjunto de bibliotecas e diretrizes para desenvolvimento","Um tipo de software antivírus","Um método de testar software"],
    correctAnswer: 1,
    explanation: "Framework é uma base pronta de bibliotecas e padrões que agiliza o desenvolvimento (ex.: React, Django, Laravel)."
  },
  {
    question: "O que é DevOps no contexto de desenvolvimento de software?",
    options: ["Um tipo de linguagem de programação","Um conjunto de práticas para integração de desenvolvimento e operações","Um modelo de distribuição de software","Um tipo de sistema operacional"],
    correctAnswer: 1,
    explanation: "DevOps integra as equipes de desenvolvimento e de operações com automação e entrega contínua."
  },
  {
    question: "O que é Scrum em gerenciamento de projetos de software?",
    options: ["Um tipo de software antivírus","Um método de desenvolvimento ágil","Um modelo de distribuição de serviços","Um tipo de linguagem de programação"],
    correctAnswer: 1,
    explanation: "Scrum é um framework ágil: o trabalho é dividido em sprints curtas, com papéis (Product Owner, Scrum Master, time) e reuniões regulares."
  },
  {
    question: "O que é machine learning em software?",
    options: ["Um tipo de software antivírus","Um método de ensino de programação para máquinas","Um ramo da inteligência artificial que permite que o software aprenda com dados","Um tipo de sistema operacional"],
    correctAnswer: 2,
    explanation: "Machine learning é um ramo da IA em que o sistema aprende padrões a partir de dados, sem ser programado regra por regra."
  },
  {
    question: "O que é refatoração de código?",
    options: ["Um método de compilação de código","Um processo de otimização e reestruturação do código-fonte sem alterar seu comportamento externo","Um tipo de linguagem de programação","Um método de teste de software"],
    correctAnswer: 1,
    explanation: "Refatorar é melhorar a estrutura interna do código (legibilidade, organização) sem mudar o que ele faz para o usuário."
  }
];

/* ===== Lógica do simulado =====
   - alternativas e perguntas embaralhadas a cada tentativa
   - explicação após cada resposta + botão de próxima
   - melhor nota salva no aparelho */
const TXT = {"q":"Pergunta","of":"de","ok":"✅ Correto!","bad":"❌ Incorreto. Resposta certa:","next":"Próxima pergunta ▶","finish":"Ver resultado 🏁","final":"Resultado final","best":"Sua melhor nota neste simulado:","m1":"🏆 Excelente! Você domina este conteúdo.","m2":"👍 Bom resultado! Revise os pontos que errou.","m3":"📚 Continue estudando: releia a disciplina e tente de novo."};
function scoreText(s, n){ return `Você acertou ${s} de ${n} perguntas (${Math.round(s / n * 100)}%)`; }

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

let quiz=[], currentQuestion=0, score=0;

function prepareQuiz(){
  quiz = shuffle(questions.map(q => {
    const opts = shuffle(q.options.map((text,i) => ({ text, ok: i === q.correctAnswer })));
    return { question:q.question, options:opts.map(o=>o.text), correctAnswer:opts.findIndex(o=>o.ok), explanation:q.explanation };
  }));
  currentQuestion=0; score=0;
}

function loadQuestion(){
  const q = quiz[currentQuestion];
  document.getElementById("progress-text").textContent = TXT.q+" "+(currentQuestion+1)+" "+TXT.of+" "+quiz.length;
  document.getElementById("progress").style.width = (currentQuestion/quiz.length*100)+"%";
  document.getElementById("question-container").textContent = q.question;
  const fb = document.getElementById("feedback"); fb.className=""; fb.innerHTML="";
  document.getElementById("next-btn").style.display="none";
  document.getElementById("result").innerHTML="";
  const box = document.getElementById("options-container");
  box.innerHTML="";
  q.options.forEach((option,index) => {
    const b=document.createElement("button");
    b.textContent=option; b.className="option"; b.dataset.index=index; b.onclick=selectOption;
    box.appendChild(b);
  });
}

function selectOption(event){
  const q = quiz[currentQuestion];
  const buttons=document.querySelectorAll(".option");
  buttons.forEach(b=>b.disabled=true);
  const selected=parseInt(event.currentTarget.dataset.index,10);
  const fb=document.getElementById("feedback");
  let titulo;
  if(selected===q.correctAnswer){
    event.currentTarget.classList.add("correct"); score++; fb.className="ok"; titulo=TXT.ok;
  }else{
    event.currentTarget.classList.add("wrong"); buttons[q.correctAnswer].classList.add("correct"); fb.className="erro";
    titulo=TXT.bad+" "+q.options[q.correctAnswer];
  }
  if(window.Estudo) Estudo.registrarResposta(q, selected===q.correctAnswer);
  fb.innerHTML='<div class="fb-titulo"></div><div class="fb-texto"></div>';
  fb.querySelector(".fb-titulo").textContent=titulo;
  fb.querySelector(".fb-texto").textContent=q.explanation||"";
  const next=document.getElementById("next-btn");
  next.textContent = currentQuestion+1<quiz.length ? TXT.next : TXT.finish;
  next.style.display="block";
  next.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function nextQuestion(){
  currentQuestion++;
  if(currentQuestion<quiz.length){ loadQuestion(); window.scrollTo({top:0,behavior:"smooth"}); }
  else showResult();
}

function showResult(){
  const n=quiz.length, pct=score/n;
  document.getElementById("progress").style.width="100%";
  document.getElementById("progress-text").textContent="";
  document.getElementById("question-container").textContent=TXT.final;
  document.getElementById("options-container").innerHTML="";
  const fb=document.getElementById("feedback"); fb.className=""; fb.innerHTML="";
  document.getElementById("next-btn").style.display="none";
  let best=score;
  if(window.Estudo) best=Estudo.salvarNota(score,n).melhor;
  const r=document.getElementById("result");
  r.innerHTML="";
  const a=document.createElement("span"); a.textContent=scoreText(score,n);
  const m=document.createElement("span"); m.className="msg"; m.textContent= pct>=0.8?TXT.m1 : pct>=0.6?TXT.m2 : TXT.m3;
  const b=document.createElement("span"); b.className="best"; b.textContent=TXT.best+" "+best+"/"+n;
  r.append(a,m,b);
  if(window.Estudo && Estudo.erros().length){
    const rv=document.createElement("a"); rv.href="revisao.html"; rv.className="btn-revisar";
    rv.textContent="📌 Revisar meus erros ("+Estudo.erros().length+")";
    r.appendChild(rv);
  }
  if(window.Estudo) Estudo.oferta(r, pct);
  document.getElementById("restart-btn").style.display="inline-block";
  try{ const g=(typeof gtag==="function")?gtag:(window.parent&&window.parent.gtag); if(g) g("event","simulado_concluido",{simulado:document.title,acertos:score,total:n}); }catch(e){}
}

document.getElementById("next-btn").onclick=nextQuestion;
document.getElementById("restart-btn").onclick=function(){
  this.style.display="none"; prepareQuiz(); loadQuestion();
};

prepareQuiz();
loadQuestion();

</script>

</body>
</html>
