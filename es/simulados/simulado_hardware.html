<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hardware</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;}
body{background:linear-gradient(135deg,#4CAF50,#2E7D32);min-height:100vh;display:flex;justify-content:center;align-items:center;}
#main-wrapper{width:95%;max-width:650px;}
#quiz-container{background:#fff;padding:25px;border-radius:16px;box-shadow:0 15px 40px rgba(0,0,0,0.2);text-align:center;animation:fadeIn .4s;}
h2{margin-bottom:10px;color:#2E7D32;}
#progress-text{margin-bottom:10px;font-size:14px;color:#555;}
#progress-bar{width:100%;height:10px;background:#ddd;border-radius:20px;overflow:hidden;margin-bottom:20px;}
#progress{height:100%;width:0%;background:#4CAF50;transition:.3s;}
#question-container{font-weight:bold;margin-bottom:20px;}
#options-container{display:grid;grid-template-columns:1fr;gap:10px;}
.option{width:100%;background:#4CAF50;color:#fff;padding:14px;border:none;border-radius:8px;cursor:pointer;transition:.3s;font-size:16px;}
.option:hover{background:#388E3C;transform:scale(1.02);}
.option:disabled{opacity:.7;cursor:not-allowed;}
.correct{background:#2E7D32!important;}
.wrong{background:#C62828!important;}
#result{margin-top:15px;font-weight:bold;}
#restart-btn{margin-top:20px;padding:12px 20px;border:none;background:#2E7D32;color:white;border-radius:8px;cursor:pointer;font-size:16px;display:none;}
#restart-btn:hover{background:#1B5E20;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@media(min-width:600px){#options-container{grid-template-columns:1fr 1fr;}}

/* === MELHORIAS: feedback, próxima, voltar === */
.btn-voltar{display:inline-block;margin-bottom:12px;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;padding:10px 14px;border-radius:8px;background:rgba(255,255,255,0.18);}
.btn-voltar:hover{background:rgba(255,255,255,0.3);}
body{align-items:flex-start!important;}
#main-wrapper{margin:auto;padding:16px 0;}
.option:disabled{transform:none;}
.option:disabled:not(.correct):not(.wrong){background:#b0b7b0;}
.option.correct:disabled,.option.wrong:disabled{opacity:1;}
.option.correct:disabled::before{content:"✔ ";}
.option.wrong:disabled::before{content:"✖ ";}
#question-container{line-height:1.4;}
#feedback{display:none;margin-top:16px;text-align:left;border-radius:10px;padding:14px 16px;font-size:15px;line-height:1.5;animation:fadeIn .3s;}
#feedback.ok{display:block;background:#e8f5e9;border-left:5px solid #2E7D32;}
#feedback.erro{display:block;background:#ffebee;border-left:5px solid #C62828;}
#feedback .fb-titulo{font-weight:bold;margin-bottom:6px;color:#222;}
#feedback .fb-texto{color:#444;}
#next-btn{display:none;margin-top:14px;width:100%;padding:13px;border:none;border-radius:8px;background:#1565C0;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;}
#next-btn:hover{background:#0D47A1;}
#result .msg{display:block;margin-top:8px;font-weight:normal;color:#444;}
#result .btn-revisar{display:block;margin:16px auto 0;max-width:320px;padding:12px;border-radius:8px;background:#f59e0b;color:#fff;text-decoration:none;font-weight:bold;}
#result .best{display:block;margin-top:6px;font-size:13px;font-weight:normal;color:#777;}

</style>
<script src="../../js/estudo.js"></script>
<link rel="stylesheet" href="../../css/escuro.css">
<script src="../../js/tema.js"></script>
</head>
<body>
<div id="main-wrapper">

<a href="../simulados.html" class="btn-voltar" onclick="if(history.length>1){history.back();return false;}">← Volver</a>

<div id="quiz-container">
<h2>Hardware</h2>
<div id="progress-text"></div>
<div id="progress-bar"><div id="progress"></div></div>
<div id="question-container"></div>
<div id="options-container"></div>

<div id="feedback"></div>

<button id="next-btn"></button>
<p id="result"></p>
<button id="restart-btn">Repetir Simulacro</button>
</div>
</div>
<script>
const questions = [
  {
    question: "¿Qué componente es responsable de ejecutar instrucciones y realizar el procesamiento principal de la computadora?",
    options: ["Memoria RAM","Procesador (CPU)","Disco duro","Tarjeta de red"],
    correctAnswer: 1,
    explanation: "El procesador (CPU) ejecuta las instrucciones de los programas y coordina el procesamiento. Es el \"cerebro\" de la computadora."
  },
  {
    question: "¿Cuál es la función principal de la memoria RAM en una computadora?",
    options: ["Almacenar datos permanentemente","Ejecutar cálculos matemáticos","Almacenar temporalmente datos y programas en ejecución","Conectar dispositivos externos"],
    correctAnswer: 2,
    explanation: "La RAM guarda temporalmente los programas y datos en uso para que la CPU acceda rápido. Es volátil: se borra al apagar."
  },
  {
    question: "¿Qué dispositivo es responsable del almacenamiento permanente de archivos y programas?",
    options: ["Memoria caché","Registros","HD o SSD","BIOS"],
    correctAnswer: 2,
    explanation: "El HD y el SSD son memorias de almacenamiento permanente (no volátiles): conservan archivos, programas y el sistema operativo sin energía."
  },
  {
    question: "¿Cuál es la función principal de la placa base (motherboard) en una computadora?",
    options: ["Procesar gráficos","Conectar y permitir la comunicación entre los componentes","Almacenar el sistema operativo","Controlar internet"],
    correctAnswer: 1,
    explanation: "La placa base es la placa principal: conecta procesador, memoria, almacenamiento y periféricos y permite que se comuniquen."
  },
  {
    question: "¿Qué componente es responsable del procesamiento de gráficos e imágenes?",
    options: ["GPU o tarjeta de video","Memoria RAM","Chipset","BIOS"],
    correctAnswer: 0,
    explanation: "La GPU (tarjeta de video) procesa gráficos, imágenes y videos, aliviando a la CPU. También se usa en juegos e IA."
  },
  {
    question: "¿Qué caracteriza a un SSD en comparación con un HD tradicional?",
    options: ["Utiliza discos magnéticos","Es más lento en el acceso a los datos","Utiliza memoria flash y tiene mayor velocidad","No permite almacenamiento de archivos"],
    correctAnswer: 2,
    explanation: "El SSD usa memoria flash, sin partes mecánicas: es más rápido, silencioso y resistente a golpes que el HD."
  },
  {
    question: "¿Qué componente de la placa base controla la comunicación entre el procesador, la memoria y los periféricos?",
    options: ["Chipset","Fuente de alimentación","Memoria caché","Cooler"],
    correctAnswer: 0,
    explanation: "El chipset es el conjunto de chips de la placa base que gestiona la comunicación entre procesador, memoria, buses y periféricos."
  },
  {
    question: "¿Cuál es la función de la fuente de alimentación en una computadora?",
    options: ["Almacenar datos","Suministrar energía eléctrica a los componentes","Controlar el sistema operativo","Procesar gráficos"],
    correctAnswer: 1,
    explanation: "La fuente convierte la corriente alterna del enchufe en corriente continua con los voltajes que usan los componentes."
  },
  {
    question: "¿Qué tipo de dispositivo se considera periférico de entrada?",
    options: ["Monitor","Impresora","Teclado","Altavoz"],
    correctAnswer: 2,
    explanation: "Los periféricos de entrada envían datos a la computadora: teclado, mouse, escáner, micrófono, cámara web."
  },
  {
    question: "¿Qué dispositivo se considera periférico de salida?",
    options: ["Ratón","Teclado","Escáner","Monitor"],
    correctAnswer: 3,
    explanation: "Los periféricos de salida muestran o entregan resultados: monitor, impresora, parlantes."
  },
  {
    question: "¿Qué es el BIOS en una computadora?",
    options: ["Sistema básico que inicializa el hardware","Un tipo de memoria RAM","Un dispositivo de almacenamiento","Un software antivirus"],
    correctAnswer: 0,
    explanation: "La BIOS (o UEFI, su versión moderna) es el firmware grabado en la placa base que prueba el hardware (POST) e inicia el sistema operativo."
  },
  {
    question: "¿Cuál es la función de la memoria caché en el procesador?",
    options: ["Almacenar archivos del usuario","Acelerar el acceso a datos frecuentemente utilizados","Sustituir la memoria RAM","Almacenar el sistema operativo"],
    correctAnswer: 1,
    explanation: "La caché es una memoria muy rápida junto a la CPU que guarda los datos más usados y reduce la espera por la RAM."
  },
  {
    question: "¿Qué es un bus en una computadora?",
    options: ["Un dispositivo de almacenamiento","Un camino de comunicación entre los componentes","Un tipo de procesador","Un programa del sistema operativo"],
    correctAnswer: 1,
    explanation: "Un bus es el conjunto de vías (cables/pistas) por donde los componentes intercambian datos, direcciones y señales de control."
  },
  {
    question: "¿Qué bus es responsable de transportar datos entre los componentes de la computadora?",
    options: ["Bus de control","Bus de direcciones","Bus de datos","Bus gráfico"],
    correctAnswer: 2,
    explanation: "El bus de datos transporta los datos entre CPU, memoria y periféricos. El de direcciones indica el lugar y el de control coordina."
  },
  {
    question: "¿Qué tecnología permite usar varios discos para mejorar el rendimiento o la seguridad de los datos?",
    options: ["RAID","BIOS","GPU","HDMI"],
    correctAnswer: 0,
    explanation: "RAID combina varios discos para ganar rendimiento (RAID 0), seguridad/espejado (RAID 1) o ambos (RAID 5, RAID 10)."
  },
  {
    question: "¿Qué puerto se usa ampliamente para conectar periféricos como teclado, ratón y memorias USB?",
    options: ["HDMI","USB","VGA","PS/2"],
    correctAnswer: 1,
    explanation: "USB es el puerto estándar para periféricos como teclado, mouse, memoria USB e impresora, con plug and play."
  },
  {
    question: "¿Qué puerto se usa principalmente para transmisión de video digital en alta definición?",
    options: ["HDMI","USB","Ethernet","Serie"],
    correctAnswer: 0,
    explanation: "HDMI transmite video y audio digitales en alta definición por un solo cable (monitores, TV, proyectores)."
  },
  {
    question: "¿Qué componente es responsable de mantener la temperatura adecuada del procesador?",
    options: ["Cooler","Chipset","BIOS","Bus"],
    correctAnswer: 0,
    explanation: "El cooler (disipador con ventilador) retira el calor del procesador y evita sobrecalentamiento y bloqueos."
  },
  {
    question: "¿Qué dispositivo permite conectar la computadora a una red o a internet?",
    options: ["Tarjeta de red","Tarjeta de video","Memoria RAM","Procesador"],
    correctAnswer: 0,
    explanation: "La tarjeta de red (NIC), por cable o Wi-Fi, conecta la computadora a una red local y a internet."
  },
  {
    question: "¿Cuál es la principal diferencia entre HD y SSD?",
    options: ["El SSD utiliza partes mecánicas","El HD es más rápido que el SSD","El SSD utiliza memoria flash y tiene acceso más rápido a los datos","El SSD no almacena archivos"],
    correctAnswer: 2,
    explanation: "El HD graba en discos magnéticos giratorios. El SSD usa memoria flash, sin partes móviles, y es mucho más rápido."
  }
];

/* ===== Lógica do simulado =====
   - alternativas e perguntas embaralhadas a cada tentativa
   - explicação após cada resposta + botão de próxima
   - melhor nota salva no aparelho */
const TXT = {"q":"Pregunta","of":"de","ok":"✅ ¡Correcto!","bad":"❌ Incorrecto. Respuesta correcta:","next":"Siguiente pregunta ▶","finish":"Ver resultado 🏁","final":"Resultado final","best":"Tu mejor nota en este simulacro:","m1":"🏆 ¡Excelente! Dominas este contenido.","m2":"👍 ¡Buen resultado! Repasa los puntos que fallaste.","m3":"📚 Sigue estudiando: vuelve a leer la materia e inténtalo de nuevo."};
function scoreText(s, n){ return `Acertaste ${s} de ${n} preguntas (${Math.round(s / n * 100)}%)`; }

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

let quiz=[], currentQuestion=0, score=0;

function prepareQuiz(){
  quiz = shuffle(questions.map(q => {
    const opts = shuffle(q.options.map((text,i) => ({ text, ok: i === q.correctAnswer })));
    return { question:q.question, options:opts.map(o=>o.text), correctAnswer:opts.findIndex(o=>o.ok), explanation:q.explanation };
  }));
  currentQuestion=0; score=0;
}

function loadQuestion(){
  const q = quiz[currentQuestion];
  document.getElementById("progress-text").textContent = TXT.q+" "+(currentQuestion+1)+" "+TXT.of+" "+quiz.length;
  document.getElementById("progress").style.width = (currentQuestion/quiz.length*100)+"%";
  document.getElementById("question-container").textContent = q.question;
  const fb = document.getElementById("feedback"); fb.className=""; fb.innerHTML="";
  document.getElementById("next-btn").style.display="none";
  document.getElementById("result").innerHTML="";
  const box = document.getElementById("options-container");
  box.innerHTML="";
  q.options.forEach((option,index) => {
    const b=document.createElement("button");
    b.textContent=option; b.className="option"; b.dataset.index=index; b.onclick=selectOption;
    box.appendChild(b);
  });
}

function selectOption(event){
  const q = quiz[currentQuestion];
  const buttons=document.querySelectorAll(".option");
  buttons.forEach(b=>b.disabled=true);
  const selected=parseInt(event.currentTarget.dataset.index,10);
  const fb=document.getElementById("feedback");
  let titulo;
  if(selected===q.correctAnswer){
    event.currentTarget.classList.add("correct"); score++; fb.className="ok"; titulo=TXT.ok;
  }else{
    event.currentTarget.classList.add("wrong"); buttons[q.correctAnswer].classList.add("correct"); fb.className="erro";
    titulo=TXT.bad+" "+q.options[q.correctAnswer];
  }
  if(window.Estudo) Estudo.registrarResposta(q, selected===q.correctAnswer);
  fb.innerHTML='<div class="fb-titulo"></div><div class="fb-texto"></div>';
  fb.querySelector(".fb-titulo").textContent=titulo;
  fb.querySelector(".fb-texto").textContent=q.explanation||"";
  const next=document.getElementById("next-btn");
  next.textContent = currentQuestion+1<quiz.length ? TXT.next : TXT.finish;
  next.style.display="block";
  next.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function nextQuestion(){
  currentQuestion++;
  if(currentQuestion<quiz.length){ loadQuestion(); window.scrollTo({top:0,behavior:"smooth"}); }
  else showResult();
}

function showResult(){
  const n=quiz.length, pct=score/n;
  document.getElementById("progress").style.width="100%";
  document.getElementById("progress-text").textContent="";
  document.getElementById("question-container").textContent=TXT.final;
  document.getElementById("options-container").innerHTML="";
  const fb=document.getElementById("feedback"); fb.className=""; fb.innerHTML="";
  document.getElementById("next-btn").style.display="none";
  let best=score;
  if(window.Estudo) best=Estudo.salvarNota(score,n).melhor;
  const r=document.getElementById("result");
  r.innerHTML="";
  const a=document.createElement("span"); a.textContent=scoreText(score,n);
  const m=document.createElement("span"); m.className="msg"; m.textContent= pct>=0.8?TXT.m1 : pct>=0.6?TXT.m2 : TXT.m3;
  const b=document.createElement("span"); b.className="best"; b.textContent=TXT.best+" "+best+"/"+n;
  r.append(a,m,b);
  if(window.Estudo && Estudo.erros().length){
    const rv=document.createElement("a"); rv.href="revisao.html"; rv.className="btn-revisar";
    rv.textContent="📌 Repasar mis errores ("+Estudo.erros().length+")";
    r.appendChild(rv);
  }
  if(window.Estudo) Estudo.oferta(r, pct);
  document.getElementById("restart-btn").style.display="inline-block";
  try{ const g=(typeof gtag==="function")?gtag:(window.parent&&window.parent.gtag); if(g) g("event","simulado_concluido",{simulado:document.title,acertos:score,total:n}); }catch(e){}
}

document.getElementById("next-btn").onclick=nextQuestion;
document.getElementById("restart-btn").onclick=function(){
  this.style.display="none"; prepareQuiz(); loadQuestion();
};

prepareQuiz();
loadQuestion();

</script>
</body>
</html>
