<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buses de Datos</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;}
body{background:linear-gradient(135deg,#4CAF50,#2E7D32);min-height:100vh;display:flex;justify-content:center;align-items:center;}
#main-wrapper{width:95%;max-width:650px;}
#quiz-container{background:#fff;padding:25px;border-radius:16px;box-shadow:0 15px 40px rgba(0,0,0,0.2);text-align:center;animation:fadeIn .4s;}
h2{margin-bottom:10px;color:#2E7D32;}
#progress-text{margin-bottom:10px;font-size:14px;color:#555;}
#progress-bar{width:100%;height:10px;background:#ddd;border-radius:20px;overflow:hidden;margin-bottom:20px;}
#progress{height:100%;width:0%;background:#4CAF50;transition:.3s;}
#question-container{font-weight:bold;margin-bottom:20px;}
#options-container{display:grid;grid-template-columns:1fr;gap:10px;}
.option{width:100%;background:#4CAF50;color:#fff;padding:14px;border:none;border-radius:8px;cursor:pointer;transition:.3s;font-size:16px;}
.option:hover{background:#388E3C;transform:scale(1.02);}
.option:disabled{opacity:.7;cursor:not-allowed;}
.correct{background:#2E7D32!important;}
.wrong{background:#C62828!important;}
#result{margin-top:15px;font-weight:bold;}
#restart-btn{margin-top:20px;padding:12px 20px;border:none;background:#2E7D32;color:white;border-radius:8px;cursor:pointer;font-size:16px;display:none;}
#restart-btn:hover{background:#1B5E20;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@media(min-width:600px){#options-container{grid-template-columns:1fr 1fr;}}

/* === MELHORIAS: feedback, próxima, voltar === */
.btn-voltar{display:inline-block;margin-bottom:12px;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;padding:10px 14px;border-radius:8px;background:rgba(255,255,255,0.18);}
.btn-voltar:hover{background:rgba(255,255,255,0.3);}
body{align-items:flex-start!important;}
#main-wrapper{margin:auto;padding:16px 0;}
.option:disabled{transform:none;}
.option:disabled:not(.correct):not(.wrong){background:#b0b7b0;}
.option.correct:disabled,.option.wrong:disabled{opacity:1;}
.option.correct:disabled::before{content:"✔ ";}
.option.wrong:disabled::before{content:"✖ ";}
#question-container{line-height:1.4;}
#feedback{display:none;margin-top:16px;text-align:left;border-radius:10px;padding:14px 16px;font-size:15px;line-height:1.5;animation:fadeIn .3s;}
#feedback.ok{display:block;background:#e8f5e9;border-left:5px solid #2E7D32;}
#feedback.erro{display:block;background:#ffebee;border-left:5px solid #C62828;}
#feedback .fb-titulo{font-weight:bold;margin-bottom:6px;color:#222;}
#feedback .fb-texto{color:#444;}
#next-btn{display:none;margin-top:14px;width:100%;padding:13px;border:none;border-radius:8px;background:#1565C0;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;}
#next-btn:hover{background:#0D47A1;}
#result .msg{display:block;margin-top:8px;font-weight:normal;color:#444;}
#result .btn-revisar{display:block;margin:16px auto 0;max-width:320px;padding:12px;border-radius:8px;background:#f59e0b;color:#fff;text-decoration:none;font-weight:bold;}
#result .best{display:block;margin-top:6px;font-size:13px;font-weight:normal;color:#777;}

</style>
<script src="../../js/estudo.js"></script>
<link rel="stylesheet" href="../../css/escuro.css">
<script src="../../js/tema.js"></script>
</head>
<body>
<div id="main-wrapper">

<a href="../simulados.html" class="btn-voltar" onclick="if(history.length>1){history.back();return false;}">← Volver</a>

<div id="quiz-container">
<h2>Buses de Datos</h2>
<div id="progress-text"></div>
<div id="progress-bar"><div id="progress"></div></div>
<div id="question-container"></div>
<div id="options-container"></div>

<div id="feedback"></div>

<button id="next-btn"></button>
<p id="result"></p>
<button id="restart-btn">Repetir Simulacro</button>
</div>
</div>
<script>
const questions = [
  {
    question: "¿Qué es un bus de direcciones en un sistema de computadora?",
    options: ["Un camino para transferencia de datos entre dispositivos","Un canal de comunicación para periféricos","Una vía de acceso a internet","Un medio para identificar la ubicación en la memoria"],
    correctAnswer: 3,
    explanation: "El bus de direcciones indica en qué posición de memoria (o dispositivo) se leerán o escribirán los datos. Es unidireccional: sale de la CPU."
  },
  {
    question: "¿Cuál es la función del bus de datos en un sistema de computadora?",
    options: ["Transferir direcciones de memoria","Transportar información entre componentes","Controlar la velocidad de la CPU","Suministrar energía a los dispositivos periféricos"],
    correctAnswer: 1,
    explanation: "El bus de datos transporta los datos en sí entre la CPU, la memoria y los periféricos. Es bidireccional."
  },
  {
    question: "¿Qué es un bus PCI en relación con las computadoras?",
    options: ["Periféricos Conectados Internamente","Peripheral Component Interconnect","Procesador Central Integrado","Protocolo de Comunicación Interna"],
    correctAnswer: 1,
    explanation: "PCI = Peripheral Component Interconnect, bus de expansión para tarjetas (red, sonido, video). Fue reemplazado por PCI Express."
  },
  {
    question: "¿Cuál es la importancia del bus USB en términos de conectividad?",
    options: ["Conectar la CPU a internet","Facilitar la transferencia de datos entre dispositivos","Controlar la velocidad de la RAM","Gestionar la alimentación eléctrica de la computadora"],
    correctAnswer: 1,
    explanation: "El USB (Universal Serial Bus) estandarizó la conexión de periféricos, con plug and play y alimentación eléctrica por el cable."
  },
  {
    question: "¿Qué es el overclocking en relación con los buses de informática?",
    options: ["Aumentar la velocidad de procesamiento de la CPU","Reducir el ancho de banda del bus de datos","Desconectar dispositivos periféricos","Disminuir la capacidad de la memoria RAM"],
    correctAnswer: 0,
    explanation: "El overclocking consiste en aumentar la frecuencia (clock) de la CPU, la memoria o los buses por encima del valor de fábrica para ganar rendimiento."
  },
  {
    question: "¿Cuál es la función de un bus FireWire en un sistema de computadora?",
    options: ["Transferencia de datos a alta velocidad","Control de la alimentación eléctrica","Conexión inalámbrica con periféricos","Gestión del BIOS"],
    correctAnswer: 0,
    explanation: "FireWire (IEEE 1394) es un bus serie de alta velocidad, muy usado en el pasado para cámaras de video y audio profesional."
  },
  {
    question: "¿Qué es un bus ISA en informática?",
    options: ["Instrucción de Sistema Avanzado","Industry Standard Architecture","Internal System Access","Integrated Software Application"],
    correctAnswer: 1,
    explanation: "ISA = Industry Standard Architecture, bus de expansión antiguo de las PC IBM, reemplazado por PCI."
  },
  {
    question: "¿Cómo se utiliza el bus AGP en una computadora?",
    options: ["Para conectar periféricos USB","Para controlar la velocidad de la CPU","Para mejorar el rendimiento gráfico","Para gestionar el BIOS"],
    correctAnswer: 2,
    explanation: "El AGP (Accelerated Graphics Port) se creó solo para tarjetas de video, con más rendimiento gráfico que el PCI. Después llegó PCI Express."
  },
  {
    question: "¿Qué es el bus SATA en relación con el almacenamiento de datos?",
    options: ["Serial Advanced Technology Attachment","System Access Time Allocation","Sequential Access Transfer Architecture","Storage Area Network Access"],
    correctAnswer: 0,
    explanation: "SATA = Serial Advanced Technology Attachment, interfaz serie que conecta discos HD, SSD y unidades ópticas a la placa base. Reemplazó a IDE/PATA."
  },
  {
    question: "¿Cuál es la función de un bus de expansión en una computadora?",
    options: ["Gestionar la memoria caché","Conectar periféricos adicionales","Controlar la CPU en tiempo real","Reducir la temperatura interna de la computadora"],
    correctAnswer: 1,
    explanation: "Los buses de expansión (PCI, PCI Express) permiten conectar tarjetas adicionales a la placa base, como video, red y sonido."
  },
  {
    question: "¿Qué significa la sigla DDR en relación con la memoria RAM?",
    options: ["Dynamic Data Rate","Double Data Rate","Digital Data Readout","Direct Data Retrieval"],
    correctAnswer: 1,
    explanation: "DDR = Double Data Rate: la memoria transfiere datos dos veces por ciclo de reloj (en la subida y en la bajada de la señal). Generaciones: DDR3, DDR4, DDR5."
  },
  {
    question: "¿Qué es un bus de sistema en una computadora?",
    options: ["Una red de comunicación interna","Un camino exclusivo para la CPU","Un protocolo de seguridad","Una interfaz de usuario"],
    correctAnswer: 0,
    explanation: "El bus del sistema es el conjunto de vías internas (datos, direcciones y control) que conecta la CPU, la memoria y los demás componentes."
  },
  {
    question: "¿Cómo se utiliza el bus Ethernet en redes de computadoras?",
    options: ["Para transferencia de datos entre dispositivos locales","Para controlar la velocidad de la CPU","Para gestionar la memoria caché","Para conectar dispositivos inalámbricos"],
    correctAnswer: 0,
    explanation: "Ethernet es el estándar más usado en redes locales (LAN) cableadas y define cómo viajan los datos entre los dispositivos."
  },
  {
    question: "¿Qué es un bus HyperTransport en sistemas de computadoras?",
    options: ["Un canal de comunicación entre CPU y periféricos","Una forma de overclocking automático","Un protocolo de seguridad avanzado","Un medio para conectar dispositivos USB"],
    correctAnswer: 0,
    explanation: "HyperTransport, creado por AMD, es una conexión punto a punto de alta velocidad entre el procesador y otros componentes del sistema."
  },
  {
    question: "¿Cuál es la función del Front Side Bus (FSB) en una placa base?",
    options: ["Gestionar la memoria RAM","Controlar el ancho de banda del bus de datos","Conectar periféricos externos","Facilitar la transferencia de datos entre CPU y RAM"],
    correctAnswer: 3,
    explanation: "El FSB (Front Side Bus) conectaba la CPU al chipset (northbridge) y, a través de él, a la RAM. Fue reemplazado por controladores de memoria integrados."
  },
  {
    question: "¿Qué es un bus InfiniBand en términos de comunicación de datos?",
    options: ["Un protocolo de comunicación inalámbrica","Una interfaz de usuario avanzada","Una red de alta velocidad para clústeres de computadoras","Un medio de transferencia de energía eléctrica"],
    correctAnswer: 2,
    explanation: "InfiniBand es una tecnología de interconexión de altísima velocidad y baja latencia, usada en supercomputadoras, clústeres y centros de datos."
  },
  {
    question: "¿Cómo se utiliza el bus HDMI en sistemas de entretenimiento?",
    options: ["Para conectar dispositivos USB","Para transmitir audio y video en alta definición","Para controlar la CPU en tiempo real","Para gestionar la memoria caché"],
    correctAnswer: 1,
    explanation: "HDMI transmite video y audio digitales de alta definición por un solo cable, conectando PC, consolas y televisores."
  },
  {
    question: "¿Qué es un bus de comunicación interna en un procesador multicore?",
    options: ["Un medio de transferencia de energía eléctrica","Una red de comunicación entre procesadores","Un protocolo de seguridad avanzado","Una interfaz de usuario gráfica"],
    correctAnswer: 1,
    explanation: "En los procesadores multinúcleo, un bus o red interna (como ring bus o mesh) conecta los núcleos entre sí y con la caché compartida."
  },
  {
    question: "¿Cuál es la función del bus de control en una computadora?",
    options: ["Transportar datos entre memoria y CPU","Transportar direcciones de memoria","Enviar señales de control y sincronización entre los componentes","Almacenar programas del sistema"],
    correctAnswer: 2,
    explanation: "El bus de control lleva señales de comando y sincronización (lectura, escritura, reloj, interrupciones) entre los componentes."
  },
  {
    question: "¿Qué conjunto de buses forma el bus del sistema en una computadora?",
    options: ["USB, HDMI y SATA","PCI, AGP e IDE","Datos, Dirección y Control","Ethernet, Wi-Fi y Bluetooth"],
    correctAnswer: 2,
    explanation: "El bus del sistema está formado por tres buses: datos (qué viaja), direcciones (a dónde va) y control (cómo y cuándo)."
  }
];

/* ===== Lógica do simulado =====
   - alternativas e perguntas embaralhadas a cada tentativa
   - explicação após cada resposta + botão de próxima
   - melhor nota salva no aparelho */
const TXT = {"q":"Pregunta","of":"de","ok":"✅ ¡Correcto!","bad":"❌ Incorrecto. Respuesta correcta:","next":"Siguiente pregunta ▶","finish":"Ver resultado 🏁","final":"Resultado final","best":"Tu mejor nota en este simulacro:","m1":"🏆 ¡Excelente! Dominas este contenido.","m2":"👍 ¡Buen resultado! Repasa los puntos que fallaste.","m3":"📚 Sigue estudiando: vuelve a leer la materia e inténtalo de nuevo."};
function scoreText(s, n){ return `Acertaste ${s} de ${n} preguntas (${Math.round(s / n * 100)}%)`; }

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

let quiz=[], currentQuestion=0, score=0;

function prepareQuiz(){
  quiz = shuffle(questions.map(q => {
    const opts = shuffle(q.options.map((text,i) => ({ text, ok: i === q.correctAnswer })));
    return { question:q.question, options:opts.map(o=>o.text), correctAnswer:opts.findIndex(o=>o.ok), explanation:q.explanation };
  }));
  currentQuestion=0; score=0;
}

function loadQuestion(){
  const q = quiz[currentQuestion];
  document.getElementById("progress-text").textContent = TXT.q+" "+(currentQuestion+1)+" "+TXT.of+" "+quiz.length;
  document.getElementById("progress").style.width = (currentQuestion/quiz.length*100)+"%";
  document.getElementById("question-container").textContent = q.question;
  const fb = document.getElementById("feedback"); fb.className=""; fb.innerHTML="";
  document.getElementById("next-btn").style.display="none";
  document.getElementById("result").innerHTML="";
  const box = document.getElementById("options-container");
  box.innerHTML="";
  q.options.forEach((option,index) => {
    const b=document.createElement("button");
    b.textContent=option; b.className="option"; b.dataset.index=index; b.onclick=selectOption;
    box.appendChild(b);
  });
}

function selectOption(event){
  const q = quiz[currentQuestion];
  const buttons=document.querySelectorAll(".option");
  buttons.forEach(b=>b.disabled=true);
  const selected=parseInt(event.currentTarget.dataset.index,10);
  const fb=document.getElementById("feedback");
  let titulo;
  if(selected===q.correctAnswer){
    event.currentTarget.classList.add("correct"); score++; fb.className="ok"; titulo=TXT.ok;
  }else{
    event.currentTarget.classList.add("wrong"); buttons[q.correctAnswer].classList.add("correct"); fb.className="erro";
    titulo=TXT.bad+" "+q.options[q.correctAnswer];
  }
  if(window.Estudo) Estudo.registrarResposta(q, selected===q.correctAnswer);
  fb.innerHTML='<div class="fb-titulo"></div><div class="fb-texto"></div>';
  fb.querySelector(".fb-titulo").textContent=titulo;
  fb.querySelector(".fb-texto").textContent=q.explanation||"";
  const next=document.getElementById("next-btn");
  next.textContent = currentQuestion+1<quiz.length ? TXT.next : TXT.finish;
  next.style.display="block";
  next.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function nextQuestion(){
  currentQuestion++;
  if(currentQuestion<quiz.length){ loadQuestion(); window.scrollTo({top:0,behavior:"smooth"}); }
  else showResult();
}

function showResult(){
  const n=quiz.length, pct=score/n;
  document.getElementById("progress").style.width="100%";
  document.getElementById("progress-text").textContent="";
  document.getElementById("question-container").textContent=TXT.final;
  document.getElementById("options-container").innerHTML="";
  const fb=document.getElementById("feedback"); fb.className=""; fb.innerHTML="";
  document.getElementById("next-btn").style.display="none";
  let best=score;
  if(window.Estudo) best=Estudo.salvarNota(score,n).melhor;
  const r=document.getElementById("result");
  r.innerHTML="";
  const a=document.createElement("span"); a.textContent=scoreText(score,n);
  const m=document.createElement("span"); m.className="msg"; m.textContent= pct>=0.8?TXT.m1 : pct>=0.6?TXT.m2 : TXT.m3;
  const b=document.createElement("span"); b.className="best"; b.textContent=TXT.best+" "+best+"/"+n;
  r.append(a,m,b);
  if(window.Estudo && Estudo.erros().length){
    const rv=document.createElement("a"); rv.href="revisao.html"; rv.className="btn-revisar";
    rv.textContent="📌 Repasar mis errores ("+Estudo.erros().length+")";
    r.appendChild(rv);
  }
  if(window.Estudo) Estudo.oferta(r, pct);
  document.getElementById("restart-btn").style.display="inline-block";
  try{ const g=(typeof gtag==="function")?gtag:(window.parent&&window.parent.gtag); if(g) g("event","simulado_concluido",{simulado:document.title,acertos:score,total:n}); }catch(e){}
}

document.getElementById("next-btn").onclick=nextQuestion;
document.getElementById("restart-btn").onclick=function(){
  this.style.display="none"; prepareQuiz(); loadQuestion();
};

prepareQuiz();
loadQuestion();

</script>
</body>
</html>
