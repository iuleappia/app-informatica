<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algorithms and Programming</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;}
body{background:linear-gradient(135deg,#4CAF50,#2E7D32);min-height:100vh;display:flex;justify-content:center;align-items:center;}
#main-wrapper{width:95%;max-width:650px;}
#quiz-container{background:#fff;padding:25px;border-radius:16px;box-shadow:0 15px 40px rgba(0,0,0,0.2);text-align:center;animation:fadeIn .4s;}
h2{margin-bottom:10px;color:#2E7D32;}
#progress-text{margin-bottom:10px;font-size:14px;color:#555;}
#progress-bar{width:100%;height:10px;background:#ddd;border-radius:20px;overflow:hidden;margin-bottom:20px;}
#progress{height:100%;width:0%;background:#4CAF50;transition:.3s;}
#question-container{font-weight:bold;margin-bottom:20px;}
#options-container{display:grid;grid-template-columns:1fr;gap:10px;}
.option{width:100%;background:#4CAF50;color:#fff;padding:14px;border:none;border-radius:8px;cursor:pointer;transition:.3s;font-size:16px;}
.option:hover{background:#388E3C;transform:scale(1.02);}
.option:disabled{opacity:.7;cursor:not-allowed;}
.correct{background:#2E7D32!important;}
.wrong{background:#C62828!important;}
#result{margin-top:15px;font-weight:bold;}
#restart-btn{margin-top:20px;padding:12px 20px;border:none;background:#2E7D32;color:white;border-radius:8px;cursor:pointer;font-size:16px;display:none;}
#restart-btn:hover{background:#1B5E20;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@media(min-width:600px){#options-container{grid-template-columns:1fr 1fr;}}

/* === MELHORIAS: feedback, próxima, voltar === */
.btn-voltar{display:inline-block;margin-bottom:12px;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;padding:10px 14px;border-radius:8px;background:rgba(255,255,255,0.18);}
.btn-voltar:hover{background:rgba(255,255,255,0.3);}
body{align-items:flex-start!important;}
#main-wrapper{margin:auto;padding:16px 0;}
.option:disabled{transform:none;}
.option:disabled:not(.correct):not(.wrong){background:#b0b7b0;}
.option.correct:disabled,.option.wrong:disabled{opacity:1;}
.option.correct:disabled::before{content:"✔ ";}
.option.wrong:disabled::before{content:"✖ ";}
#question-container{line-height:1.4;}
#feedback{display:none;margin-top:16px;text-align:left;border-radius:10px;padding:14px 16px;font-size:15px;line-height:1.5;animation:fadeIn .3s;}
#feedback.ok{display:block;background:#e8f5e9;border-left:5px solid #2E7D32;}
#feedback.erro{display:block;background:#ffebee;border-left:5px solid #C62828;}
#feedback .fb-titulo{font-weight:bold;margin-bottom:6px;color:#222;}
#feedback .fb-texto{color:#444;}
#next-btn{display:none;margin-top:14px;width:100%;padding:13px;border:none;border-radius:8px;background:#1565C0;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;}
#next-btn:hover{background:#0D47A1;}
#result .msg{display:block;margin-top:8px;font-weight:normal;color:#444;}
#result .btn-revisar{display:block;margin:16px auto 0;max-width:320px;padding:12px;border-radius:8px;background:#f59e0b;color:#fff;text-decoration:none;font-weight:bold;}
#result .best{display:block;margin-top:6px;font-size:13px;font-weight:normal;color:#777;}

</style>
<script src="../../js/estudo.js"></script>
<link rel="stylesheet" href="../../css/escuro.css">
<script src="../../js/tema.js"></script>
</head>
<body>
<div id="main-wrapper">

<a href="../simulados.html" class="btn-voltar" onclick="if(history.length>1){history.back();return false;}">← Back</a>

<div id="quiz-container">
<h2>Algorithms and Programming</h2>
<div id="progress-text"></div>
<div id="progress-bar"><div id="progress"></div></div>
<div id="question-container"></div>
<div id="options-container"></div>

<div id="feedback"></div>

<button id="next-btn"></button>
<p id="result"></p>
<button id="restart-btn">Retake Quiz</button>
</div>
</div>
<script>
const questions = [
  {
    question: "What is an algorithm?",
    options: ["A type of hardware","A step-by-step set of instructions for solving a problem","A programming language","A data storage device"],
    correctAnswer: 1,
    explanation: "An algorithm is a finite, ordered sequence of steps that solves a problem. It doesn't depend on hardware or language: the language is just how you write it."
  },
  {
    question: "What is the main function of an algorithm?",
    options: ["Process input data","Store information permanently","Perform complex mathematical operations","Solve a problem efficiently"],
    correctAnswer: 3,
    explanation: "An algorithm's goal is to solve a problem correctly and efficiently. Processing data or doing math are means, not the purpose."
  },
  {
    question: "What is the complexity of an algorithm?",
    options: ["The amount of code written","The time and space required to execute the algorithm","The number of instructions per second","The algorithm's ability to adapt to different problems"],
    correctAnswer: 1,
    explanation: "Complexity measures how much time (time complexity) and memory (space complexity) the algorithm uses as the input grows."
  },
  {
    question: "In programming, what is a variable?",
    options: ["A constant value","A data type","A storage location for data","A mathematical expression"],
    correctAnswer: 2,
    explanation: "A variable is a named place in memory that holds a value that can change while the program runs. A fixed value is a constant."
  },
  {
    question: "What is a control structure in algorithms?",
    options: ["An input device","A set of conditional or repetition instructions","A data type","A central processing unit"],
    correctAnswer: 1,
    explanation: "Control structures define the program's flow: decisions (if/else) and repetition (while, for)."
  },
  {
    question: "What is recursion in algorithms?",
    options: ["A type of loop","A technique where a function calls itself","A method for permanently storing data","A concept related to code complexity"],
    correctAnswer: 1,
    explanation: "Recursion happens when a function calls itself to solve smaller parts of the problem until it reaches a base case."
  },
  {
    question: "What is a linear search?",
    options: ["A type of control structure","A data sorting method","A technique for finding an element in a list by going through it sequentially","A form of encryption"],
    correctAnswer: 2,
    explanation: "Linear (sequential) search checks the elements one by one, from start to end. It works even on unsorted lists."
  },
  {
    question: "What is a sorting algorithm?",
    options: ["A method for organizing data in a hierarchical structure","A type of search","A set of instructions for printing results on screen","A method for arranging elements in a specific order"],
    correctAnswer: 3,
    explanation: "Sorting algorithms (bubble sort, quicksort, merge sort…) put elements in ascending, descending or alphabetical order."
  },
  {
    question: "What is an infinite loop in programming?",
    options: ["A syntax error","An instruction that is never executed","A control structure that repeats indefinitely","A always-false condition"],
    correctAnswer: 2,
    explanation: "An infinite loop is a repetition whose stop condition is never met, so the program keeps repeating forever."
  },
  {
    question: "What is the importance of efficiency in algorithms?",
    options: ["Efficiency is not relevant","It only affects code readability","It influences resource consumption such as time and space","It only matters for simple algorithms"],
    correctAnswer: 2,
    explanation: "The more efficient the algorithm, the less processing time and memory it uses, which matters a lot with large amounts of data."
  },
  {
    question: "What is pseudocode?",
    options: ["A type of programming language","Real source code","A representation of algorithms using a mix of natural language and programming elements","An encryption technique"],
    correctAnswer: 2,
    explanation: "Pseudocode describes an algorithm in near-human language with programming elements (if, while, read). It isn't executed and has nothing to do with encryption."
  },
  {
    question: "What is a data structure in algorithms?",
    options: ["A set of variables","A way to organize and store data so it can be used efficiently","A type of conditional instruction","A sorting method"],
    correctAnswer: 1,
    explanation: "Data structures (arrays, lists, stacks, queues, trees) organize data in memory so it can be accessed and changed efficiently."
  },
  {
    question: "What is Big-O notation?",
    options: ["A programming language","A way to represent algorithms using drawings","A notation used to describe the performance or complexity of an algorithm in terms of time or space","A type of control structure"],
    correctAnswer: 2,
    explanation: "Big-O notation describes how time or memory grows with input size in the worst case. E.g. O(n), O(log n), O(n²)."
  },
  {
    question: "What is a binary search algorithm?",
    options: ["A method for searching information on the internet","A search in a sorted list by repeatedly halving it","A technique for searching data in reverse order","A conditional control structure"],
    correctAnswer: 1,
    explanation: "Binary search only works on sorted lists: it compares with the middle element and discards half the list each step, running in O(log n)."
  },
  {
    question: "What is a greedy algorithm?",
    options: ["An algorithm that always picks the option that seems best at the moment","An algorithm that avoids making decisions","An algorithm that requires many resources","An efficient sorting method"],
    correctAnswer: 0,
    explanation: "A greedy algorithm picks the best local option at each step, hoping to reach a good overall solution. It doesn't always guarantee the optimal one."
  },
  {
    question: "What is time analysis in algorithms?",
    options: ["An analysis of code efficiency in terms of performance","An analysis of the amount of code written","An encryption method","A type of search"],
    correctAnswer: 0,
    explanation: "Time analysis estimates how many operations an algorithm performs relative to input size, so different solutions can be compared."
  },
  {
    question: "What is an insertion sort algorithm?",
    options: ["A method for organizing random data","An algorithm that inserts data into a list randomly","A sorting method that builds a sorted sequence one element at a time","A search technique"],
    correctAnswer: 2,
    explanation: "Insertion sort takes one element at a time and inserts it into the right place in the already sorted part, like sorting cards in your hand."
  },
  {
    question: "What is a graph in algorithms?",
    options: ["A type of variable","A flow control structure","A visual representation of data","A set of vertices and edges connecting those vertices"],
    correctAnswer: 3,
    explanation: "A graph is a structure of vertices (nodes) connected by edges. It represents networks, maps, routes and relationships."
  },
  {
    question: "What is tail recursion?",
    options: ["A technique for searching data at the bottom of a list","A type of loop","A form of calling the recursive function at the end of execution","A complex data structure"],
    correctAnswer: 2,
    explanation: "In tail recursion, the recursive call is the function's last operation, which lets some compilers optimize it into a loop."
  },
  {
    question: "What is the quicksort algorithm?",
    options: ["A method for organizing data slowly","A type of search in a sorted list","An efficient sorting algorithm that uses a divide-and-conquer approach","An encryption technique"],
    correctAnswer: 2,
    explanation: "Quicksort picks a pivot, splits the elements smaller and larger than it, and sorts each part recursively (divide and conquer)."
  }
];

/* ===== Lógica do simulado =====
   - alternativas e perguntas embaralhadas a cada tentativa
   - explicação após cada resposta + botão de próxima
   - melhor nota salva no aparelho */
const TXT = {"q":"Question","of":"of","ok":"✅ Correct!","bad":"❌ Incorrect. Right answer:","next":"Next question ▶","finish":"See result 🏁","final":"Final result","best":"Your best score on this quiz:","m1":"🏆 Excellent! You master this topic.","m2":"👍 Good result! Review the points you missed.","m3":"📚 Keep studying: reread the lesson and try again."};
function scoreText(s, n){ return `You got ${s} of ${n} questions right (${Math.round(s / n * 100)}%)`; }

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

let quiz=[], currentQuestion=0, score=0;

function prepareQuiz(){
  quiz = shuffle(questions.map(q => {
    const opts = shuffle(q.options.map((text,i) => ({ text, ok: i === q.correctAnswer })));
    return { question:q.question, options:opts.map(o=>o.text), correctAnswer:opts.findIndex(o=>o.ok), explanation:q.explanation };
  }));
  currentQuestion=0; score=0;
}

function loadQuestion(){
  const q = quiz[currentQuestion];
  document.getElementById("progress-text").textContent = TXT.q+" "+(currentQuestion+1)+" "+TXT.of+" "+quiz.length;
  document.getElementById("progress").style.width = (currentQuestion/quiz.length*100)+"%";
  document.getElementById("question-container").textContent = q.question;
  const fb = document.getElementById("feedback"); fb.className=""; fb.innerHTML="";
  document.getElementById("next-btn").style.display="none";
  document.getElementById("result").innerHTML="";
  const box = document.getElementById("options-container");
  box.innerHTML="";
  q.options.forEach((option,index) => {
    const b=document.createElement("button");
    b.textContent=option; b.className="option"; b.dataset.index=index; b.onclick=selectOption;
    box.appendChild(b);
  });
}

function selectOption(event){
  const q = quiz[currentQuestion];
  const buttons=document.querySelectorAll(".option");
  buttons.forEach(b=>b.disabled=true);
  const selected=parseInt(event.currentTarget.dataset.index,10);
  const fb=document.getElementById("feedback");
  let titulo;
  if(selected===q.correctAnswer){
    event.currentTarget.classList.add("correct"); score++; fb.className="ok"; titulo=TXT.ok;
  }else{
    event.currentTarget.classList.add("wrong"); buttons[q.correctAnswer].classList.add("correct"); fb.className="erro";
    titulo=TXT.bad+" "+q.options[q.correctAnswer];
  }
  if(window.Estudo) Estudo.registrarResposta(q, selected===q.correctAnswer);
  fb.innerHTML='<div class="fb-titulo"></div><div class="fb-texto"></div>';
  fb.querySelector(".fb-titulo").textContent=titulo;
  fb.querySelector(".fb-texto").textContent=q.explanation||"";
  const next=document.getElementById("next-btn");
  next.textContent = currentQuestion+1<quiz.length ? TXT.next : TXT.finish;
  next.style.display="block";
  next.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function nextQuestion(){
  currentQuestion++;
  if(currentQuestion<quiz.length){ loadQuestion(); window.scrollTo({top:0,behavior:"smooth"}); }
  else showResult();
}

function showResult(){
  const n=quiz.length, pct=score/n;
  document.getElementById("progress").style.width="100%";
  document.getElementById("progress-text").textContent="";
  document.getElementById("question-container").textContent=TXT.final;
  document.getElementById("options-container").innerHTML="";
  const fb=document.getElementById("feedback"); fb.className=""; fb.innerHTML="";
  document.getElementById("next-btn").style.display="none";
  let best=score;
  if(window.Estudo) best=Estudo.salvarNota(score,n).melhor;
  const r=document.getElementById("result");
  r.innerHTML="";
  const a=document.createElement("span"); a.textContent=scoreText(score,n);
  const m=document.createElement("span"); m.className="msg"; m.textContent= pct>=0.8?TXT.m1 : pct>=0.6?TXT.m2 : TXT.m3;
  const b=document.createElement("span"); b.className="best"; b.textContent=TXT.best+" "+best+"/"+n;
  r.append(a,m,b);
  if(window.Estudo && Estudo.erros().length){
    const rv=document.createElement("a"); rv.href="revisao.html"; rv.className="btn-revisar";
    rv.textContent="📌 Review my mistakes ("+Estudo.erros().length+")";
    r.appendChild(rv);
  }
  if(window.Estudo) Estudo.oferta(r, pct);
  document.getElementById("restart-btn").style.display="inline-block";
  try{ const g=(typeof gtag==="function")?gtag:(window.parent&&window.parent.gtag); if(g) g("event","simulado_concluido",{simulado:document.title,acertos:score,total:n}); }catch(e){}
}

document.getElementById("next-btn").onclick=nextQuestion;
document.getElementById("restart-btn").onclick=function(){
  this.style.display="none"; prepareQuiz(); loadQuestion();
};

prepareQuiz();
loadQuestion();

</script>
</body>
</html>
