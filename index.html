<!DOCTYPE html>
<html lang="pt-br">
<head>

<script src="js/analytics.js"></script>
<script src="js/meta-pixel.js"></script>
<script src="js/rastreio-app.js"></script>
  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>App de Informática - IuleApp</title>
<meta name="description" content="Acesse o app de estudos de informática do IuleApp: disciplinas, simulados, funções do Excel e cursos em português.">
<meta name="keywords" content="app de informática, estudos de TI, simulado online, funções do excel, disciplinas de informática">
<link rel="canonical" href="https://iuleappia.github.io/app-informatica/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="IuleApp">
<meta property="og:title" content="App de Informática - IuleApp">
<meta property="og:description" content="Acesse o app de estudos de informática do IuleApp: disciplinas, simulados, funções do Excel e cursos em português.">
<meta property="og:url" content="https://iuleappia.github.io/app-informatica/">
<meta property="og:image" content="https://iuleappia.github.io/app-informatica/img/capa.jpg">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#f1f3f5;
  height:100vh;
  overflow:hidden;
}

/* TOPO */

.topo{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:55px;
  background:linear-gradient(135deg,#0B1020,#16213E);
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding-left:15px;
  padding-right:10px;
  font-size:18px;
  font-weight:bold;
  box-shadow:0 2px 5px rgba(0,0,0,0.2);
  z-index:1000;
}

/* IDIOMAS */

.idiomas{
  display:flex;
  align-items:center;
  gap:4px;
}

.idiomas a{
  color:white;
  text-decoration:none;
  font-size:12px;
  font-weight:normal;
  padding:4px 7px;
  border-radius:6px;
}

.idiomas a.ativo{
  background:rgba(0,229,255,0.18);
  color:#FFD60A;
  font-weight:bold;
}

/* CONTEÚDO */

#app{
  position:absolute;
  top:55px;
  bottom:65px;
  left:0;
  right:0;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}

/* MENU */

.menu{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:65px;
  background:white;
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -3px 10px rgba(0,0,0,0.15);
  z-index:999;
}

/* BOTÕES */

.menu button{
  background:none;
  border:none;
  font-size:12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  cursor:pointer;
  padding:6px 10px;
  border-radius:10px;
  transition:0.2s;
  position:relative;
}

/* ÍCONE */

.menu span{
  font-size:22px;
  margin-bottom:3px;
}

/* CLIQUE */

.menu button:active{
  transform:scale(0.9);
}

/* BOTÃO ATIVO */

.menu button.ativo{
  color:#16213E;
  font-weight:bold;
}

/* LINHA DO BOTÃO ATIVO */

.menu button.ativo::before{
  content:"";
  position:absolute;
  width:40px;
  height:4px;
  background:#00B8D4;
  bottom:0;
  border-radius:10px;
}

/* RESPONSIVO */

@media(min-width:700px){

  .menu{
    height:70px;
  }

  .menu span{
    font-size:24px;
  }

  .menu button{
    font-size:13px;
  }

  .topo{
    font-size:20px;
  }

}


/* MARCA + BOTÃO DE TEMA */
#tituloPagina::before{content:"IuleApp · ";color:#FFD60A;font-weight:bold;}
.topo{border-bottom:3px solid #00E5FF;}
#btnTema{background:none;border:1px solid rgba(255,255,255,0.3);color:white;border-radius:8px;font-size:16px;padding:6px 9px;margin-left:4px;cursor:pointer;min-height:36px;}
#tituloPagina{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:6px;}
.idiomas{flex-shrink:0;}
@media(max-width:440px){.topo{font-size:16px;}.idiomas a{font-size:11px;padding:10px 5px;}.idiomas{gap:2px;}}
@media(max-width:360px){#tituloPagina::before{content:"";}}
</style>

<link rel="stylesheet" href="css/escuro.css">
<script src="js/tema.js"></script>
</head>

<body>

<!-- TOPO -->
<div class="topo">
  <span id="tituloPagina">Informática</span>
  <div class="idiomas">
    <a href="index.html" class="ativo" onclick="localStorage.setItem('userLang','pt')">🇧🇷 PT</a>
    <a href="es/index.html" onclick="localStorage.setItem('userLang','es')">🇪🇸 ES</a>
    <a href="en/index.html" onclick="localStorage.setItem('userLang','en')">🇺🇸 EN</a>
    <button id="btnTema" type="button" aria-label="Alternar modo escuro" title="Alternar modo escuro">🌙</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <iframe id="frame" src="page/home.html"></iframe>
</div>

<!-- MENU -->
<div class="menu">

  <button class="ativo" onclick="abrirPagina('page/home.html',this)">
    <span>🏠</span>
    Home
  </button>

  <button onclick="abrirPagina('page/disciplinas.html',this)">
    <span>📚</span>
    Disciplinas
  </button>

  <button onclick="abrirPagina('page/simulados.html',this)">
    <span>📝</span>
    Simulados
  </button>

  <button onclick="abrirPagina('page/excel.html',this)">
    <span>📊</span>
    Excel
  </button>

  <button onclick="abrirPagina('page/cursos.html',this)">
    <span>🌐</span>
    Cursos
  </button>

</div>

<script>

/* DOMÍNIOS EXTERNOS */

let externos = [
  "hotmart.com",
  "pay.hotmart.com",
  "payment.hotmart.com",
  "wa.me",
  "whatsapp.com",
  "instagram.com",
  "youtube.com"
];

/* FUNÇÃO PRINCIPAL */

function abrirPagina(url, botao){

  let externo = externos.some(d => url.includes(d));

  if(externo){
    window.open(url,"_blank");
  } else {
    document.getElementById("frame").src = url;
  }

  /* BOTÃO ATIVO */

  document.querySelectorAll(".menu button")
  .forEach(b => b.classList.remove("ativo"));

  botao.classList.add("ativo");

  /* PEGAR TEXTO DO BOTÃO */

  let clone = botao.cloneNode(true);
  let span = clone.querySelector("span");

  if(span) span.remove();

  let titulo = clone.innerText.trim();

  document.getElementById("tituloPagina").innerText = titulo;

}

</script>


</body>
</html>
