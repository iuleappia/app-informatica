<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algoritmos y Programación</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;}
body{background:linear-gradient(135deg,#4CAF50,#2E7D32);min-height:100vh;display:flex;justify-content:center;align-items:center;}
#main-wrapper{width:95%;max-width:650px;}
#quiz-container{background:#fff;padding:25px;border-radius:16px;box-shadow:0 15px 40px rgba(0,0,0,0.2);text-align:center;animation:fadeIn .4s;}
h2{margin-bottom:10px;color:#2E7D32;}
#progress-text{margin-bottom:10px;font-size:14px;color:#555;}
#progress-bar{width:100%;height:10px;background:#ddd;border-radius:20px;overflow:hidden;margin-bottom:20px;}
#progress{height:100%;width:0%;background:#4CAF50;transition:.3s;}
#question-container{font-weight:bold;margin-bottom:20px;}
#options-container{display:grid;grid-template-columns:1fr;gap:10px;}
.option{width:100%;background:#4CAF50;color:#fff;padding:14px;border:none;border-radius:8px;cursor:pointer;transition:.3s;font-size:16px;}
.option:hover{background:#388E3C;transform:scale(1.02);}
.option:disabled{opacity:.7;cursor:not-allowed;}
.correct{background:#2E7D32!important;}
.wrong{background:#C62828!important;}
#result{margin-top:15px;font-weight:bold;}
#restart-btn{margin-top:20px;padding:12px 20px;border:none;background:#2E7D32;color:white;border-radius:8px;cursor:pointer;font-size:16px;display:none;}
#restart-btn:hover{background:#1B5E20;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@media(min-width:600px){#options-container{grid-template-columns:1fr 1fr;}}

/* === MELHORIAS: feedback, próxima, voltar === */
.btn-voltar{display:inline-block;margin-bottom:12px;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;padding:10px 14px;border-radius:8px;background:rgba(255,255,255,0.18);}
.btn-voltar:hover{background:rgba(255,255,255,0.3);}
body{align-items:flex-start!important;}
#main-wrapper{margin:auto;padding:16px 0;}
.option:disabled{transform:none;}
.option:disabled:not(.correct):not(.wrong){background:#b0b7b0;}
.option.correct:disabled,.option.wrong:disabled{opacity:1;}
.option.correct:disabled::before{content:"✔ ";}
.option.wrong:disabled::before{content:"✖ ";}
#question-container{line-height:1.4;}
#feedback{display:none;margin-top:16px;text-align:left;border-radius:10px;padding:14px 16px;font-size:15px;line-height:1.5;animation:fadeIn .3s;}
#feedback.ok{display:block;background:#e8f5e9;border-left:5px solid #2E7D32;}
#feedback.erro{display:block;background:#ffebee;border-left:5px solid #C62828;}
#feedback .fb-titulo{font-weight:bold;margin-bottom:6px;color:#222;}
#feedback .fb-texto{color:#444;}
#next-btn{display:none;margin-top:14px;width:100%;padding:13px;border:none;border-radius:8px;background:#1565C0;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;}
#next-btn:hover{background:#0D47A1;}
#result .msg{display:block;margin-top:8px;font-weight:normal;color:#444;}
#result .btn-revisar{display:block;margin:16px auto 0;max-width:320px;padding:12px;border-radius:8px;background:#f59e0b;color:#fff;text-decoration:none;font-weight:bold;}
#result .best{display:block;margin-top:6px;font-size:13px;font-weight:normal;color:#777;}

</style>
<script src="../../js/estudo.js"></script>
<link rel="stylesheet" href="../../css/escuro.css">
<script src="../../js/tema.js"></script>
</head>
<body>
<div id="main-wrapper">

<a href="../simulados.html" class="btn-voltar" onclick="if(history.length>1){history.back();return false;}">← Volver</a>

<div id="quiz-container">
<h2>Algoritmos y Programación</h2>
<div id="progress-text"></div>
<div id="progress-bar"><div id="progress"></div></div>
<div id="question-container"></div>
<div id="options-container"></div>

<div id="feedback"></div>

<button id="next-btn"></button>
<p id="result"></p>
<button id="restart-btn">Repetir Simulacro</button>
</div>
</div>
<script>
const questions = [
  {
    question: "¿Qué es un algoritmo?",
    options: ["Un tipo de hardware","Un conjunto de instrucciones paso a paso para resolver un problema","Un lenguaje de programación","Un dispositivo de almacenamiento de datos"],
    correctAnswer: 1,
    explanation: "Un algoritmo es una secuencia finita y ordenada de pasos para resolver un problema. No depende del hardware ni del lenguaje: el lenguaje solo sirve para escribirlo."
  },
  {
    question: "¿Cuál es la función principal de un algoritmo?",
    options: ["Procesar datos de entrada","Almacenar información permanentemente","Ejecutar operaciones matemáticas complejas","Resolver un problema de forma eficiente"],
    correctAnswer: 3,
    explanation: "El objetivo de un algoritmo es resolver un problema de forma correcta y eficiente. Procesar datos o hacer cálculos son medios, no la finalidad."
  },
  {
    question: "¿Qué es la complejidad de un algoritmo?",
    options: ["La cantidad de código escrito","El tiempo y el espacio necesarios para ejecutar el algoritmo","El número de instrucciones por segundo","La habilidad del algoritmo de adaptarse a diferentes problemas"],
    correctAnswer: 1,
    explanation: "La complejidad mide cuánto tiempo (complejidad temporal) y cuánta memoria (complejidad espacial) consume el algoritmo a medida que crece la entrada."
  },
  {
    question: "En programación, ¿qué es una variable?",
    options: ["Un valor constante","Un tipo de dato","Un lugar de almacenamiento para datos","Una expresión matemática"],
    correctAnswer: 2,
    explanation: "Una variable es un espacio con nombre en la memoria que guarda un valor que puede cambiar durante la ejecución. Un valor fijo es una constante."
  },
  {
    question: "¿Qué es una estructura de control en algoritmos?",
    options: ["Un dispositivo de entrada","Un conjunto de instrucciones condicionales o de repetición","Un tipo de dato","Una unidad de procesamiento central"],
    correctAnswer: 1,
    explanation: "Las estructuras de control definen el flujo del programa: decisión (si/si no) y repetición (mientras, para)."
  },
  {
    question: "¿Qué es la recursividad en algoritmos?",
    options: ["Un tipo de bucle de repetición","Una técnica donde una función se llama a sí misma","Un método para almacenar datos permanentemente","Un concepto relacionado con la complejidad del código"],
    correctAnswer: 1,
    explanation: "La recursividad ocurre cuando una función se llama a sí misma para resolver partes más pequeñas del problema, hasta llegar a un caso base."
  },
  {
    question: "¿Qué es una búsqueda lineal?",
    options: ["Un tipo de estructura de control","Un método de ordenación de datos","Una técnica para encontrar un elemento en una lista recorriéndola secuencialmente","Una forma de cifrado"],
    correctAnswer: 2,
    explanation: "En la búsqueda lineal (secuencial) los elementos se revisan uno por uno, del inicio al final. Funciona incluso en listas no ordenadas."
  },
  {
    question: "¿Qué es un algoritmo de ordenación?",
    options: ["Un método para organizar datos en una estructura jerárquica","Un tipo de búsqueda","Un conjunto de instrucciones para imprimir resultados en pantalla","Un método para organizar elementos en un orden específico"],
    correctAnswer: 3,
    explanation: "Los algoritmos de ordenamiento (bubble sort, quicksort, merge sort…) colocan los elementos en orden ascendente, descendente o alfabético."
  },
  {
    question: "¿Qué es un bucle infinito en programación?",
    options: ["Un error de sintaxis","Una instrucción que nunca se ejecuta","Una estructura de control que se repite indefinidamente","Una condición siempre falsa"],
    correctAnswer: 2,
    explanation: "Un bucle infinito es una repetición cuya condición de parada nunca se cumple, por lo que el programa queda repitiendo para siempre."
  },
  {
    question: "¿Cuál es la importancia de la eficiencia en algoritmos?",
    options: ["La eficiencia no es relevante","Afecta solo la legibilidad del código","Influye en el consumo de recursos como tiempo y espacio","Es importante solo para algoritmos simples"],
    correctAnswer: 2,
    explanation: "Cuanto más eficiente es el algoritmo, menos tiempo de procesamiento y memoria consume, lo que marca la diferencia con grandes volúmenes de datos."
  },
  {
    question: "¿Qué es un pseudocódigo?",
    options: ["Un tipo de lenguaje de programación","Un código fuente real","Una representación de algoritmos usando una mezcla de lenguaje natural y elementos de programación","Una técnica de cifrado"],
    correctAnswer: 2,
    explanation: "El pseudocódigo describe un algoritmo en un lenguaje cercano al humano, con elementos de programación (si, mientras, leer). No se ejecuta ni tiene relación con el cifrado."
  },
  {
    question: "¿Qué es una estructura de datos en algoritmos?",
    options: ["Un conjunto de variables","Una manera de organizar y almacenar datos para que puedan ser usados eficientemente","Un tipo de instrucción condicional","Un método de ordenación"],
    correctAnswer: 1,
    explanation: "Las estructuras de datos (vectores, listas, pilas, colas, árboles) organizan los datos en memoria para acceder a ellos y manipularlos con eficiencia."
  },
  {
    question: "¿Qué es la notación Big-O?",
    options: ["Un lenguaje de programación","Una forma de representar algoritmos usando dibujos","Una notación para describir el rendimiento o la complejidad de un algoritmo en términos de tiempo o espacio","Un tipo de estructura de control"],
    correctAnswer: 2,
    explanation: "La notación Big-O describe cómo crecen el tiempo o la memoria según el tamaño de la entrada en el peor caso. Ej.: O(n), O(log n), O(n²)."
  },
  {
    question: "¿Qué es un algoritmo de búsqueda binaria?",
    options: ["Un método para buscar información en internet","Un tipo de búsqueda en una lista ordenada dividiéndola por la mitad","Una técnica para buscar datos en orden inverso","Una estructura de control condicional"],
    correctAnswer: 1,
    explanation: "La búsqueda binaria solo funciona en listas ordenadas: compara con el elemento del medio y descarta la mitad en cada paso, con complejidad O(log n)."
  },
  {
    question: "¿Qué es un algoritmo codicioso (greedy algorithm)?",
    options: ["Un algoritmo que siempre elige la opción que parece ser la mejor en el momento","Un algoritmo que evita tomar decisiones","Un algoritmo que requiere muchos recursos","Un método de ordenación eficiente"],
    correctAnswer: 0,
    explanation: "El algoritmo voraz (greedy) elige la mejor opción local en cada paso, esperando llegar a una buena solución global. No siempre garantiza la óptima."
  },
  {
    question: "¿Qué es el análisis de tiempo en algoritmos?",
    options: ["Un análisis de la eficiencia del código en términos de rendimiento","Un análisis de la cantidad de código escrito","Un método de cifrado","Un tipo de búsqueda"],
    correctAnswer: 0,
    explanation: "El análisis de tiempo estima cuántas operaciones ejecuta el algoritmo según el tamaño de la entrada, para comparar la eficiencia de distintas soluciones."
  },
  {
    question: "¿Qué es un algoritmo de ordenación por inserción?",
    options: ["Un método para organizar datos aleatorios","Un algoritmo que inserta datos en una lista de forma aleatoria","Un método de ordenación que construye una secuencia ordenada de elementos uno a la vez","Una técnica de búsqueda"],
    correctAnswer: 2,
    explanation: "El insertion sort toma un elemento a la vez y lo inserta en la posición correcta de la parte ya ordenada, como quien ordena cartas en la mano."
  },
  {
    question: "¿Qué es un grafo en algoritmos?",
    options: ["Un tipo de variable","Una estructura de control de flujo","Una representación visual de datos","Un conjunto de vértices y aristas que conectan esos vértices"],
    correctAnswer: 3,
    explanation: "Un grafo es una estructura formada por vértices (nodos) unidos por aristas. Representa redes, mapas, rutas y relaciones entre elementos."
  },
  {
    question: "¿Qué es la recursión de cola?",
    options: ["Una técnica para buscar datos en la parte inferior de una lista","Un tipo de bucle","Una forma de llamar a la función recursiva al final de la ejecución","Una estructura de datos compleja"],
    correctAnswer: 2,
    explanation: "En la recursión de cola, la llamada recursiva es la última operación de la función, lo que permite que algunos compiladores la optimicen como un bucle."
  },
  {
    question: "¿Qué es un algoritmo de ordenación rápida (quicksort)?",
    options: ["Un método para organizar datos de forma lenta","Un tipo de búsqueda en una lista ordenada","Un algoritmo de ordenación eficiente que usa un enfoque de dividir y conquistar","Una técnica de cifrado"],
    correctAnswer: 2,
    explanation: "El quicksort elige un pivote, separa los menores y los mayores que él y ordena cada parte de forma recursiva (divide y vencerás)."
  }
];

/* ===== Lógica do simulado =====
   - alternativas e perguntas embaralhadas a cada tentativa
   - explicação após cada resposta + botão de próxima
   - melhor nota salva no aparelho */
const TXT = {"q":"Pregunta","of":"de","ok":"✅ ¡Correcto!","bad":"❌ Incorrecto. Respuesta correcta:","next":"Siguiente pregunta ▶","finish":"Ver resultado 🏁","final":"Resultado final","best":"Tu mejor nota en este simulacro:","m1":"🏆 ¡Excelente! Dominas este contenido.","m2":"👍 ¡Buen resultado! Repasa los puntos que fallaste.","m3":"📚 Sigue estudiando: vuelve a leer la materia e inténtalo de nuevo."};
function scoreText(s, n){ return `Acertaste ${s} de ${n} preguntas (${Math.round(s / n * 100)}%)`; }

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

let quiz=[], currentQuestion=0, score=0;

function prepareQuiz(){
  quiz = shuffle(questions.map(q => {
    const opts = shuffle(q.options.map((text,i) => ({ text, ok: i === q.correctAnswer })));
    return { question:q.question, options:opts.map(o=>o.text), correctAnswer:opts.findIndex(o=>o.ok), explanation:q.explanation };
  }));
  currentQuestion=0; score=0;
}

function loadQuestion(){
  const q = quiz[currentQuestion];
  document.getElementById("progress-text").textContent = TXT.q+" "+(currentQuestion+1)+" "+TXT.of+" "+quiz.length;
  document.getElementById("progress").style.width = (currentQuestion/quiz.length*100)+"%";
  document.getElementById("question-container").textContent = q.question;
  const fb = document.getElementById("feedback"); fb.className=""; fb.innerHTML="";
  document.getElementById("next-btn").style.display="none";
  document.getElementById("result").innerHTML="";
  const box = document.getElementById("options-container");
  box.innerHTML="";
  q.options.forEach((option,index) => {
    const b=document.createElement("button");
    b.textContent=option; b.className="option"; b.dataset.index=index; b.onclick=selectOption;
    box.appendChild(b);
  });
}

function selectOption(event){
  const q = quiz[currentQuestion];
  const buttons=document.querySelectorAll(".option");
  buttons.forEach(b=>b.disabled=true);
  const selected=parseInt(event.currentTarget.dataset.index,10);
  const fb=document.getElementById("feedback");
  let titulo;
  if(selected===q.correctAnswer){
    event.currentTarget.classList.add("correct"); score++; fb.className="ok"; titulo=TXT.ok;
  }else{
    event.currentTarget.classList.add("wrong"); buttons[q.correctAnswer].classList.add("correct"); fb.className="erro";
    titulo=TXT.bad+" "+q.options[q.correctAnswer];
  }
  if(window.Estudo) Estudo.registrarResposta(q, selected===q.correctAnswer);
  fb.innerHTML='<div class="fb-titulo"></div><div class="fb-texto"></div>';
  fb.querySelector(".fb-titulo").textContent=titulo;
  fb.querySelector(".fb-texto").textContent=q.explanation||"";
  const next=document.getElementById("next-btn");
  next.textContent = currentQuestion+1<quiz.length ? TXT.next : TXT.finish;
  next.style.display="block";
  next.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function nextQuestion(){
  currentQuestion++;
  if(currentQuestion<quiz.length){ loadQuestion(); window.scrollTo({top:0,behavior:"smooth"}); }
  else showResult();
}

function showResult(){
  const n=quiz.length, pct=score/n;
  document.getElementById("progress").style.width="100%";
  document.getElementById("progress-text").textContent="";
  document.getElementById("question-container").textContent=TXT.final;
  document.getElementById("options-container").innerHTML="";
  const fb=document.getElementById("feedback"); fb.className=""; fb.innerHTML="";
  document.getElementById("next-btn").style.display="none";
  let best=score;
  if(window.Estudo) best=Estudo.salvarNota(score,n).melhor;
  const r=document.getElementById("result");
  r.innerHTML="";
  const a=document.createElement("span"); a.textContent=scoreText(score,n);
  const m=document.createElement("span"); m.className="msg"; m.textContent= pct>=0.8?TXT.m1 : pct>=0.6?TXT.m2 : TXT.m3;
  const b=document.createElement("span"); b.className="best"; b.textContent=TXT.best+" "+best+"/"+n;
  r.append(a,m,b);
  if(window.Estudo && Estudo.erros().length){
    const rv=document.createElement("a"); rv.href="revisao.html"; rv.className="btn-revisar";
    rv.textContent="📌 Repasar mis errores ("+Estudo.erros().length+")";
    r.appendChild(rv);
  }
  if(window.Estudo) Estudo.oferta(r, pct);
  document.getElementById("restart-btn").style.display="inline-block";
  try{ const g=(typeof gtag==="function")?gtag:(window.parent&&window.parent.gtag); if(g) g("event","simulado_concluido",{simulado:document.title,acertos:score,total:n}); }catch(e){}
}

document.getElementById("next-btn").onclick=nextQuestion;
document.getElementById("restart-btn").onclick=function(){
  this.style.display="none"; prepareQuiz(); loadQuestion();
};

prepareQuiz();
loadQuestion();

</script>
</body>
</html>
