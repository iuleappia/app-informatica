<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barramentos</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:linear-gradient(135deg,#4CAF50,#2E7D32);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

#main-wrapper{
width:95%;
max-width:650px;
}

#quiz-container{
background:#fff;
padding:25px;
border-radius:16px;
box-shadow:0 15px 40px rgba(0,0,0,0.2);
text-align:center;
animation:fadeIn .4s;
}

h2{
margin-bottom:10px;
color:#2E7D32;
}

#progress-text{
margin-bottom:10px;
font-size:14px;
color:#555;
}

#progress-bar{
width:100%;
height:10px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin-bottom:20px;
}

#progress{
height:100%;
width:0%;
background:#4CAF50;
transition:.3s;
}

#question-container{
font-weight:bold;
margin-bottom:20px;
}

#options-container{
display:grid;
grid-template-columns:1fr;
gap:10px;
}

.option{
width:100%;
background:#4CAF50;
color:#fff;
padding:14px;
border:none;
border-radius:8px;
cursor:pointer;
transition:.3s;
font-size:16px;
}

.option:hover{
background:#388E3C;
transform:scale(1.02);
}

.option:disabled{
opacity:.7;
cursor:not-allowed;
}

.correct{
background:#2E7D32!important;
}

.wrong{
background:#C62828!important;
}

#result{
margin-top:15px;
font-weight:bold;
}

#restart-btn{
margin-top:20px;
padding:12px 20px;
border:none;
background:#2E7D32;
color:white;
border-radius:8px;
cursor:pointer;
font-size:16px;
display:none;
}

#restart-btn:hover{
background:#1B5E20;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:translateY(0);}
}

@media(min-width:600px){
#options-container{
grid-template-columns:1fr 1fr;
}
}


/* === MELHORIAS: feedback, próxima, voltar === */
.btn-voltar{display:inline-block;margin-bottom:12px;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;padding:10px 14px;border-radius:8px;background:rgba(255,255,255,0.18);}
.btn-voltar:hover{background:rgba(255,255,255,0.3);}
body{align-items:flex-start!important;}
#main-wrapper{margin:auto;padding:16px 0;}
.option:disabled{transform:none;}
.option:disabled:not(.correct):not(.wrong){background:#b0b7b0;}
.option.correct:disabled,.option.wrong:disabled{opacity:1;}
.option.correct:disabled::before{content:"✔ ";}
.option.wrong:disabled::before{content:"✖ ";}
#question-container{line-height:1.4;}
#feedback{display:none;margin-top:16px;text-align:left;border-radius:10px;padding:14px 16px;font-size:15px;line-height:1.5;animation:fadeIn .3s;}
#feedback.ok{display:block;background:#e8f5e9;border-left:5px solid #2E7D32;}
#feedback.erro{display:block;background:#ffebee;border-left:5px solid #C62828;}
#feedback .fb-titulo{font-weight:bold;margin-bottom:6px;color:#222;}
#feedback .fb-texto{color:#444;}
#next-btn{display:none;margin-top:14px;width:100%;padding:13px;border:none;border-radius:8px;background:#1565C0;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;}
#next-btn:hover{background:#0D47A1;}
#result .msg{display:block;margin-top:8px;font-weight:normal;color:#444;}
#result .btn-revisar{display:block;margin:16px auto 0;max-width:320px;padding:12px;border-radius:8px;background:#f59e0b;color:#fff;text-decoration:none;font-weight:bold;}
#result .best{display:block;margin-top:6px;font-size:13px;font-weight:normal;color:#777;}

</style>
<script src="../js/estudo.js"></script>
<link rel="stylesheet" href="../css/escuro.css">
<script src="../js/tema.js"></script>
</head>

<body>

<div id="main-wrapper">

<a href="../page/simulados.html" class="btn-voltar" onclick="if(history.length>1){history.back();return false;}">← Voltar</a>


<div id="quiz-container">

<h2>Barramentos</h2>

<div id="progress-text"></div>

<div id="progress-bar">
<div id="progress"></div>
</div>

<div id="question-container"></div>

<div id="options-container"></div>

<div id="feedback"></div>

<button id="next-btn"></button>

<p id="result"></p>

<button id="restart-btn">Refazer Simulado</button>

</div>

</div>

<script>

const questions = [
  {
    question: "O que é um barramento de endereço em um sistema de computador?",
    options: ["Um caminho para transferência de dados entre dispositivos","Um canal de comunicação para periféricos","Uma via de acesso à internet","Um meio de identificar a localização na memória"],
    correctAnswer: 3,
    explanation: "O barramento de endereço indica em que posição da memória (ou dispositivo) os dados serão lidos ou gravados. Ele é unidirecional: sai da CPU."
  },
  {
    question: "Qual é a função do barramento de dados em um sistema de computador?",
    options: ["Transferir endereços de memória","Transportar informações entre componentes","Controlar a velocidade da CPU","Fornecer energia aos dispositivos periféricos"],
    correctAnswer: 1,
    explanation: "O barramento de dados transporta os dados propriamente ditos entre CPU, memória e periféricos. É bidirecional."
  },
  {
    question: "O que é um barramento PCI em relação a computadores?",
    options: ["Periféricos Conectados Internamente","Peripheral Component Interconnect","Processador Central Integrado","Protocolo de Comunicação Interna"],
    correctAnswer: 1,
    explanation: "PCI = Peripheral Component Interconnect, barramento de expansão para placas (rede, som, vídeo). Foi substituído pelo PCI Express."
  },
  {
    question: "Qual é a importância do barramento USB em termos de conectividade?",
    options: ["Conectar a CPU à internet","Facilitar a transferência de dados entre dispositivos","Controlar a velocidade da RAM","Gerenciar a alimentação elétrica do computador"],
    correctAnswer: 1,
    explanation: "O USB (Universal Serial Bus) padronizou a conexão de periféricos, com plug and play e alimentação elétrica pelo cabo."
  },
  {
    question: "O que é overclocking em relação aos barramentos de informática?",
    options: ["Aumentar a velocidade de processamento da CPU","Reduzir a largura de banda do barramento de dados","Desconectar dispositivos periféricos","Diminuir a capacidade da memória RAM"],
    correctAnswer: 0,
    explanation: "Overclocking é aumentar a frequência (clock) da CPU, memória ou barramentos acima do padrão de fábrica, para ganhar desempenho."
  },
  {
    question: "Qual é a função de um barramento FireWire em um sistema de computador?",
    options: ["Transferência de dados em alta velocidade","Controle da alimentação elétrica","Conexão sem fio com periféricos","Gerenciamento da BIOS"],
    correctAnswer: 0,
    explanation: "FireWire (IEEE 1394) é um barramento serial de alta velocidade, muito usado no passado para câmeras de vídeo e áudio profissional."
  },
  {
    question: "O que é um barramento ISA em informática?",
    options: ["Instrução de Sistema Avançado","Industry Standard Architecture","Internal System Access","Integrated Software Application"],
    correctAnswer: 1,
    explanation: "ISA = Industry Standard Architecture, barramento de expansão antigo dos PCs IBM, substituído pelo PCI."
  },
  {
    question: "Como o barramento AGP é utilizado em um computador?",
    options: ["Para conectar periféricos USB","Para controlar a velocidade da CPU","Para melhorar o desempenho gráfico","Para gerenciar a BIOS"],
    correctAnswer: 2,
    explanation: "O AGP (Accelerated Graphics Port) foi criado exclusivamente para placas de vídeo, com mais desempenho gráfico que o PCI. Depois veio o PCI Express."
  },
  {
    question: "O que é o barramento SATA em relação ao armazenamento de dados?",
    options: ["Serial Advanced Technology Attachment","System Access Time Allocation","Sequential Access Transfer Architecture","Storage Area Network Access"],
    correctAnswer: 0,
    explanation: "SATA = Serial Advanced Technology Attachment, interface serial que conecta HDs, SSDs e drives ópticos à placa-mãe. Substituiu o IDE/PATA."
  },
  {
    question: "Qual é a função de um barramento de expansão em um computador?",
    options: ["Gerenciar a memória cache","Conectar periféricos adicionais","Controlar a CPU em tempo real","Reduzir a temperatura interna do computador"],
    correctAnswer: 1,
    explanation: "Os barramentos de expansão (PCI, PCI Express) permitem conectar placas adicionais à placa-mãe, como vídeo, rede e som."
  },
  {
    question: "O que significa a sigla DDR em relação à memória RAM?",
    options: ["Dynamic Data Rate","Double Data Rate","Digital Data Readout","Direct Data Retrieval"],
    correctAnswer: 1,
    explanation: "DDR = Double Data Rate: a memória transfere dados duas vezes por ciclo de clock (na subida e na descida do sinal). Gerações: DDR3, DDR4, DDR5."
  },
  {
    question: "O que é um barramento de sistema em um computador?",
    options: ["Uma rede de comunicação interna","Um caminho exclusivo para a CPU","Um protocolo de segurança","Uma interface de usuário"],
    correctAnswer: 0,
    explanation: "O barramento de sistema é o conjunto de vias internas (dados, endereço e controle) que liga CPU, memória e demais componentes."
  },
  {
    question: "Como o barramento Ethernet é utilizado em redes de computadores?",
    options: ["Para transferência de dados entre dispositivos locais","Para controlar a velocidade da CPU","Para gerenciar a memória cache","Para conectar dispositivos sem fio"],
    correctAnswer: 0,
    explanation: "Ethernet é o padrão mais usado em redes locais (LAN) cabeadas, definindo como os dados trafegam entre os dispositivos."
  },
  {
    question: "O que é um barramento HyperTransport em sistemas de computadores?",
    options: ["Um canal de comunicação entre CPU e periféricos","Uma forma de overclocking automático","Um protocolo de segurança avançado","Um meio de conectar dispositivos USB"],
    correctAnswer: 0,
    explanation: "HyperTransport, criado pela AMD, é uma ligação ponto a ponto de alta velocidade entre o processador e outros componentes do sistema."
  },
  {
    question: "Qual é a função do barramento Front Side Bus (FSB) em uma placa-mãe?",
    options: ["Gerenciar a memória RAM","Controlar a largura de banda do barramento de dados","Conectar periféricos externos","Facilitar a transferência de dados entre CPU e RAM"],
    correctAnswer: 3,
    explanation: "O FSB (Front Side Bus) ligava a CPU ao chipset (northbridge) e, por ele, à memória RAM. Foi substituído por controladores de memória integrados."
  },
  {
    question: "O que é um barramento InfiniBand em termos de comunicação de dados?",
    options: ["Um protocolo de comunicação sem fio","Uma interface de usuário avançada","Uma rede de alta velocidade para clusters de computadores","Um meio de transferência de energia elétrica"],
    correctAnswer: 2,
    explanation: "InfiniBand é uma tecnologia de interconexão de altíssima velocidade e baixa latência, usada em supercomputadores, clusters e data centers."
  },
  {
    question: "Como o barramento HDMI é utilizado em sistemas de entretenimento?",
    options: ["Para conectar dispositivos USB","Para transmitir áudio e vídeo de alta definição","Para controlar a CPU em tempo real","Para gerenciar a memória cache"],
    correctAnswer: 1,
    explanation: "HDMI transmite vídeo e áudio digitais de alta definição em um único cabo, ligando PCs, consoles e TVs."
  },
  {
    question: "O que é um barramento de comunicação interna em um processador multicore?",
    options: ["Um meio de transferência de energia elétrica","Uma rede de comunicação entre processadores","Um protocolo de segurança avançado","Uma interface de usuário gráfica"],
    correctAnswer: 1,
    explanation: "Em processadores multicore, um barramento ou rede interna (como ring bus ou mesh) liga os núcleos entre si e à cache compartilhada."
  },
  {
    question: "Qual é a função do barramento de controle em um computador?",
    options: ["Transportar dados entre memória e CPU","Transportar endereços de memória","Enviar sinais de controle e sincronização entre os componentes","Armazenar programas do sistema"],
    correctAnswer: 2,
    explanation: "O barramento de controle leva sinais de comando e sincronização (leitura, escrita, clock, interrupções) entre os componentes."
  },
  {
    question: "Qual conjunto de barramentos forma o barramento do sistema em um computador?",
    options: ["USB, HDMI e SATA","PCI, AGP e IDE","Dados, Endereço e Controle","Ethernet, Wi-Fi e Bluetooth"],
    correctAnswer: 2,
    explanation: "O barramento do sistema é formado por três barramentos: dados (o que trafega), endereço (para onde vai) e controle (como e quando)."
  }
];

/* ===== Lógica do simulado =====
   - alternativas e perguntas embaralhadas a cada tentativa
   - explicação após cada resposta + botão de próxima
   - melhor nota salva no aparelho */
const TXT = {"q":"Pergunta","of":"de","ok":"✅ Correto!","bad":"❌ Incorreto. Resposta certa:","next":"Próxima pergunta ▶","finish":"Ver resultado 🏁","final":"Resultado final","best":"Sua melhor nota neste simulado:","m1":"🏆 Excelente! Você domina este conteúdo.","m2":"👍 Bom resultado! Revise os pontos que errou.","m3":"📚 Continue estudando: releia a disciplina e tente de novo."};
function scoreText(s, n){ return `Você acertou ${s} de ${n} perguntas (${Math.round(s / n * 100)}%)`; }

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

let quiz=[], currentQuestion=0, score=0;

function prepareQuiz(){
  quiz = shuffle(questions.map(q => {
    const opts = shuffle(q.options.map((text,i) => ({ text, ok: i === q.correctAnswer })));
    return { question:q.question, options:opts.map(o=>o.text), correctAnswer:opts.findIndex(o=>o.ok), explanation:q.explanation };
  }));
  currentQuestion=0; score=0;
}

function loadQuestion(){
  const q = quiz[currentQuestion];
  document.getElementById("progress-text").textContent = TXT.q+" "+(currentQuestion+1)+" "+TXT.of+" "+quiz.length;
  document.getElementById("progress").style.width = (currentQuestion/quiz.length*100)+"%";
  document.getElementById("question-container").textContent = q.question;
  const fb = document.getElementById("feedback"); fb.className=""; fb.innerHTML="";
  document.getElementById("next-btn").style.display="none";
  document.getElementById("result").innerHTML="";
  const box = document.getElementById("options-container");
  box.innerHTML="";
  q.options.forEach((option,index) => {
    const b=document.createElement("button");
    b.textContent=option; b.className="option"; b.dataset.index=index; b.onclick=selectOption;
    box.appendChild(b);
  });
}

function selectOption(event){
  const q = quiz[currentQuestion];
  const buttons=document.querySelectorAll(".option");
  buttons.forEach(b=>b.disabled=true);
  const selected=parseInt(event.currentTarget.dataset.index,10);
  const fb=document.getElementById("feedback");
  let titulo;
  if(selected===q.correctAnswer){
    event.currentTarget.classList.add("correct"); score++; fb.className="ok"; titulo=TXT.ok;
  }else{
    event.currentTarget.classList.add("wrong"); buttons[q.correctAnswer].classList.add("correct"); fb.className="erro";
    titulo=TXT.bad+" "+q.options[q.correctAnswer];
  }
  if(window.Estudo) Estudo.registrarResposta(q, selected===q.correctAnswer);
  fb.innerHTML='<div class="fb-titulo"></div><div class="fb-texto"></div>';
  fb.querySelector(".fb-titulo").textContent=titulo;
  fb.querySelector(".fb-texto").textContent=q.explanation||"";
  const next=document.getElementById("next-btn");
  next.textContent = currentQuestion+1<quiz.length ? TXT.next : TXT.finish;
  next.style.display="block";
  next.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function nextQuestion(){
  currentQuestion++;
  if(currentQuestion<quiz.length){ loadQuestion(); window.scrollTo({top:0,behavior:"smooth"}); }
  else showResult();
}

function showResult(){
  const n=quiz.length, pct=score/n;
  document.getElementById("progress").style.width="100%";
  document.getElementById("progress-text").textContent="";
  document.getElementById("question-container").textContent=TXT.final;
  document.getElementById("options-container").innerHTML="";
  const fb=document.getElementById("feedback"); fb.className=""; fb.innerHTML="";
  document.getElementById("next-btn").style.display="none";
  let best=score;
  if(window.Estudo) best=Estudo.salvarNota(score,n).melhor;
  const r=document.getElementById("result");
  r.innerHTML="";
  const a=document.createElement("span"); a.textContent=scoreText(score,n);
  const m=document.createElement("span"); m.className="msg"; m.textContent= pct>=0.8?TXT.m1 : pct>=0.6?TXT.m2 : TXT.m3;
  const b=document.createElement("span"); b.className="best"; b.textContent=TXT.best+" "+best+"/"+n;
  r.append(a,m,b);
  if(window.Estudo && Estudo.erros().length){
    const rv=document.createElement("a"); rv.href="revisao.html"; rv.className="btn-revisar";
    rv.textContent="📌 Revisar meus erros ("+Estudo.erros().length+")";
    r.appendChild(rv);
  }
  if(window.Estudo) Estudo.oferta(r, pct);
  document.getElementById("restart-btn").style.display="inline-block";
  try{ const g=(typeof gtag==="function")?gtag:(window.parent&&window.parent.gtag); if(g) g("event","simulado_concluido",{simulado:document.title,acertos:score,total:n}); }catch(e){}
}

document.getElementById("next-btn").onclick=nextQuestion;
document.getElementById("restart-btn").onclick=function(){
  this.style.display="none"; prepareQuiz(); loadQuestion();
};

prepareQuiz();
loadQuestion();

</script>

</body>
</html>
