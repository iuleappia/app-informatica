<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redes de Computadoras</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;}
body{background:linear-gradient(135deg,#4CAF50,#2E7D32);min-height:100vh;display:flex;justify-content:center;align-items:center;}
#main-wrapper{width:95%;max-width:650px;}
#quiz-container{background:#fff;padding:25px;border-radius:16px;box-shadow:0 15px 40px rgba(0,0,0,0.2);text-align:center;animation:fadeIn .4s;}
h2{margin-bottom:10px;color:#2E7D32;}
#progress-text{margin-bottom:10px;font-size:14px;color:#555;}
#progress-bar{width:100%;height:10px;background:#ddd;border-radius:20px;overflow:hidden;margin-bottom:20px;}
#progress{height:100%;width:0%;background:#4CAF50;transition:.3s;}
#question-container{font-weight:bold;margin-bottom:20px;}
#options-container{display:grid;grid-template-columns:1fr;gap:10px;}
.option{width:100%;background:#4CAF50;color:#fff;padding:14px;border:none;border-radius:8px;cursor:pointer;transition:.3s;font-size:16px;}
.option:hover{background:#388E3C;transform:scale(1.02);}
.option:disabled{opacity:.7;cursor:not-allowed;}
.correct{background:#2E7D32!important;}
.wrong{background:#C62828!important;}
#result{margin-top:15px;font-weight:bold;}
#restart-btn{margin-top:20px;padding:12px 20px;border:none;background:#2E7D32;color:white;border-radius:8px;cursor:pointer;font-size:16px;display:none;}
#restart-btn:hover{background:#1B5E20;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@media(min-width:600px){#options-container{grid-template-columns:1fr 1fr;}}

/* === MELHORIAS: feedback, próxima, voltar === */
.btn-voltar{display:inline-block;margin-bottom:12px;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;padding:10px 14px;border-radius:8px;background:rgba(255,255,255,0.18);}
.btn-voltar:hover{background:rgba(255,255,255,0.3);}
body{align-items:flex-start!important;}
#main-wrapper{margin:auto;padding:16px 0;}
.option:disabled{transform:none;}
.option:disabled:not(.correct):not(.wrong){background:#b0b7b0;}
.option.correct:disabled,.option.wrong:disabled{opacity:1;}
.option.correct:disabled::before{content:"✔ ";}
.option.wrong:disabled::before{content:"✖ ";}
#question-container{line-height:1.4;}
#feedback{display:none;margin-top:16px;text-align:left;border-radius:10px;padding:14px 16px;font-size:15px;line-height:1.5;animation:fadeIn .3s;}
#feedback.ok{display:block;background:#e8f5e9;border-left:5px solid #2E7D32;}
#feedback.erro{display:block;background:#ffebee;border-left:5px solid #C62828;}
#feedback .fb-titulo{font-weight:bold;margin-bottom:6px;color:#222;}
#feedback .fb-texto{color:#444;}
#next-btn{display:none;margin-top:14px;width:100%;padding:13px;border:none;border-radius:8px;background:#1565C0;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;}
#next-btn:hover{background:#0D47A1;}
#result .msg{display:block;margin-top:8px;font-weight:normal;color:#444;}
#result .btn-revisar{display:block;margin:16px auto 0;max-width:320px;padding:12px;border-radius:8px;background:#f59e0b;color:#fff;text-decoration:none;font-weight:bold;}
#result .best{display:block;margin-top:6px;font-size:13px;font-weight:normal;color:#777;}

</style>
<script src="../../js/estudo.js"></script>
<link rel="stylesheet" href="../../css/escuro.css">
<script src="../../js/tema.js"></script>
</head>
<body>
<div id="main-wrapper">

<a href="../simulados.html" class="btn-voltar" onclick="if(history.length>1){history.back();return false;}">← Volver</a>

<div id="quiz-container">
<h2>Redes de Computadoras</h2>
<div id="progress-text"></div>
<div id="progress-bar"><div id="progress"></div></div>
<div id="question-container"></div>
<div id="options-container"></div>

<div id="feedback"></div>

<button id="next-btn"></button>
<p id="result"></p>
<button id="restart-btn">Repetir Simulacro</button>
</div>
</div>
<script>
const questions = [
  {
    question: "¿Cuál es la función del protocolo TCP?",
    options: ["Transferir archivos","Enviar correos electrónicos","Transferir datos de forma confiable","Navegar por la web"],
    correctAnswer: 2,
    explanation: "TCP garantiza una entrega confiable: numera los paquetes, confirma la recepción y retransmite los perdidos."
  },
  {
    question: "¿Qué significa el acrónimo IP?",
    options: ["Internet Protocol","Internal Protocol","Intranet Port","Internet Port"],
    correctAnswer: 0,
    explanation: "IP = Internet Protocol, responsable del direccionamiento y del encaminamiento de los paquetes en la red."
  },
  {
    question: "¿Cuál es el propósito del DNS en una red?",
    options: ["Asignar direcciones IP","Traducir nombres de dominio en direcciones IP","Reenviar paquetes de datos","Cifrar datos"],
    correctAnswer: 1,
    explanation: "El DNS funciona como la agenda de internet: convierte nombres de dominio en direcciones IP."
  },
  {
    question: "¿Qué es un firewall?",
    options: ["Software antivirus","Sistema (hardware o software) que bloquea tráfico no autorizado","Protocolo de comunicación","Software de gestión de red"],
    correctAnswer: 1,
    explanation: "El firewall es un sistema de seguridad, en hardware o software, que filtra el tráfico y bloquea accesos no autorizados."
  },
  {
    question: "¿Cuál es la función del enrutador (router) en una red?",
    options: ["Conectar dispositivos en la misma subred","Reenviar paquetes entre redes distintas","Filtrar spam de correos","Gestionar servidores de archivos"],
    correctAnswer: 1,
    explanation: "El router conecta redes diferentes (ej.: tu casa e internet) y elige el camino de los paquetes hasta el destino."
  },
  {
    question: "¿Qué es una dirección MAC?",
    options: ["Una dirección IP estática","Un identificador único para dispositivos de red","Un protocolo de comunicación","Un tipo de firewall"],
    correctAnswer: 1,
    explanation: "La dirección MAC es el identificador físico de la tarjeta de red, definido por el fabricante."
  },
  {
    question: "¿Qué significa la sigla LAN?",
    options: ["Local Area Network","Long-range Area Network","Large Array Network","Low-latency Access Network"],
    correctAnswer: 0,
    explanation: "LAN = Local Area Network, red local de área limitada, como una casa, una oficina o una escuela."
  },
  {
    question: "¿Qué es un ataque de denegación de servicio (DDoS)?",
    options: ["Un ataque que intenta robar información confidencial","Un ataque que sobrecarga un sistema haciéndolo inaccesible","Un ataque de virus informático","Un ataque que intenta modificar datos en tránsito"],
    correctAnswer: 1,
    explanation: "Un DDoS usa muchos dispositivos a la vez para inundar un servidor de solicitudes hasta dejarlo inaccesible."
  },
  {
    question: "¿Cuál es la diferencia entre IPv4 e IPv6?",
    options: ["IPv4 usa direcciones de 32 bits, mientras que IPv6 usa direcciones de 128 bits","IPv4 es más reciente que IPv6","IPv4 es más seguro que IPv6","IPv4 no admite comunicación inalámbrica"],
    correctAnswer: 0,
    explanation: "IPv4 tiene 32 bits (ej.: 192.168.0.1). IPv6 tiene 128 bits, escrito en hexadecimal (ej.: 2001:db8::1), con muchísimas más direcciones."
  },
  {
    question: "¿Qué es un proxy?",
    options: ["Un tipo de firewall","Un servidor que reenvía solicitudes entre el cliente y el servidor","Un protocolo de seguridad","Un tipo de virus informático"],
    correctAnswer: 1,
    explanation: "El proxy es un intermediario: recibe las solicitudes del cliente y las reenvía al servidor. Puede filtrar accesos, hacer caché y ocultar la IP."
  },
  {
    question: "¿Cuál es la función del protocolo ICMP?",
    options: ["Reenviar paquetes entre redes","Verificar la disponibilidad de un host en la red","Cifrar comunicaciones","Asignar direcciones IP dinámicamente"],
    correctAnswer: 1,
    explanation: "ICMP envía mensajes de control y error. El ping usa ICMP para comprobar si un host está accesible."
  },
  {
    question: "¿Qué es NAT (Network Address Translation)?",
    options: ["Un protocolo de seguridad","Un tipo de dirección IP","Un método para mapear direcciones IP privadas a una sola dirección IP pública","Un tipo de cable de red"],
    correctAnswer: 2,
    explanation: "NAT permite que varios dispositivos con IP privada compartan una única IP pública para acceder a internet."
  },
  {
    question: "¿Qué es un protocolo de enrutamiento?",
    options: ["Un protocolo para transferir archivos","Un conjunto de reglas para comunicación segura","Un protocolo para reenviar paquetes entre redes","Un protocolo de cifrado"],
    correctAnswer: 2,
    explanation: "Los protocolos de enrutamiento (RIP, OSPF, BGP) definen cómo los routers intercambian información para elegir el camino de los paquetes entre redes."
  },
  {
    question: "¿Qué es SSL/TLS?",
    options: ["Un protocolo para transferencia de archivos","Un protocolo de seguridad para comunicación en la web","Un tipo de dirección IP","Un protocolo de firewall"],
    correctAnswer: 1,
    explanation: "SSL/TLS cifra los datos intercambiados entre el navegador y el servidor, protegiendo contraseñas y pagos (HTTPS)."
  },
  {
    question: "¿Cuál es la función principal de un switch en una red?",
    options: ["Reenviar paquetes entre redes","Conectar dispositivos en la misma subred","Controlar el acceso a internet","Bloquear tráfico no autorizado"],
    correctAnswer: 1,
    explanation: "El switch conecta dispositivos de la misma red local y envía los datos solo al puerto de destino, usando la dirección MAC."
  },
  {
    question: "¿Qué es un ataque de phishing?",
    options: ["Un ataque que intenta sobrecargar un sistema","Un ataque que roba información confidencial engañando al usuario","Un tipo de firewall","Un protocolo de cifrado"],
    correctAnswer: 1,
    explanation: "El phishing usa mensajes o sitios falsos que imitan empresas reales para engañar a la víctima y robar contraseñas y datos."
  },
  {
    question: "¿Qué es una dirección IP privada?",
    options: ["Una dirección IP asignada a un servidor web","Una dirección IP que no puede ser accedida desde internet","Una dirección IP asignada a un dispositivo móvil","Una dirección IP estática"],
    correctAnswer: 1,
    explanation: "Las IP privadas (10.x.x.x, 172.16–31.x.x, 192.168.x.x) se usan en redes internas y no se enrutan directamente en internet."
  },
  {
    question: "¿Cuál es la diferencia entre UDP y TCP?",
    options: ["UDP es más seguro que TCP","TCP está orientado a la conexión, mientras que UDP no lo está","UDP se usa solo para transferencia de archivos","TCP no es adecuado para redes de gran escala"],
    correctAnswer: 1,
    explanation: "TCP establece conexión y garantiza la entrega. UDP envía sin conexión: es más rápido, ideal para streaming, juegos y llamadas."
  },
  {
    question: "¿Qué es una VLAN?",
    options: ["Un tipo de dirección IP","Un protocolo de seguridad","Una red local virtual que segmenta una red física en redes lógicas","Un tipo de cable de red"],
    correctAnswer: 2,
    explanation: "Una VLAN (Virtual LAN) divide lógicamente una red física en redes separadas, mejorando la seguridad y la organización."
  },
  {
    question: "¿Qué es un gateway (puerta de enlace)?",
    options: ["Un dispositivo que conecta redes distintas","Un tipo de protocolo de seguridad","Un tipo de virus informático","Un protocolo de cifrado"],
    correctAnswer: 0,
    explanation: "El gateway (puerta de enlace) es el punto de unión entre redes diferentes. En casa, el router es la puerta de enlace predeterminada a internet."
  }
];

/* ===== Lógica do simulado =====
   - alternativas e perguntas embaralhadas a cada tentativa
   - explicação após cada resposta + botão de próxima
   - melhor nota salva no aparelho */
const TXT = {"q":"Pregunta","of":"de","ok":"✅ ¡Correcto!","bad":"❌ Incorrecto. Respuesta correcta:","next":"Siguiente pregunta ▶","finish":"Ver resultado 🏁","final":"Resultado final","best":"Tu mejor nota en este simulacro:","m1":"🏆 ¡Excelente! Dominas este contenido.","m2":"👍 ¡Buen resultado! Repasa los puntos que fallaste.","m3":"📚 Sigue estudiando: vuelve a leer la materia e inténtalo de nuevo."};
function scoreText(s, n){ return `Acertaste ${s} de ${n} preguntas (${Math.round(s / n * 100)}%)`; }

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

let quiz=[], currentQuestion=0, score=0;

function prepareQuiz(){
  quiz = shuffle(questions.map(q => {
    const opts = shuffle(q.options.map((text,i) => ({ text, ok: i === q.correctAnswer })));
    return { question:q.question, options:opts.map(o=>o.text), correctAnswer:opts.findIndex(o=>o.ok), explanation:q.explanation };
  }));
  currentQuestion=0; score=0;
}

function loadQuestion(){
  const q = quiz[currentQuestion];
  document.getElementById("progress-text").textContent = TXT.q+" "+(currentQuestion+1)+" "+TXT.of+" "+quiz.length;
  document.getElementById("progress").style.width = (currentQuestion/quiz.length*100)+"%";
  document.getElementById("question-container").textContent = q.question;
  const fb = document.getElementById("feedback"); fb.className=""; fb.innerHTML="";
  document.getElementById("next-btn").style.display="none";
  document.getElementById("result").innerHTML="";
  const box = document.getElementById("options-container");
  box.innerHTML="";
  q.options.forEach((option,index) => {
    const b=document.createElement("button");
    b.textContent=option; b.className="option"; b.dataset.index=index; b.onclick=selectOption;
    box.appendChild(b);
  });
}

function selectOption(event){
  const q = quiz[currentQuestion];
  const buttons=document.querySelectorAll(".option");
  buttons.forEach(b=>b.disabled=true);
  const selected=parseInt(event.currentTarget.dataset.index,10);
  const fb=document.getElementById("feedback");
  let titulo;
  if(selected===q.correctAnswer){
    event.currentTarget.classList.add("correct"); score++; fb.className="ok"; titulo=TXT.ok;
  }else{
    event.currentTarget.classList.add("wrong"); buttons[q.correctAnswer].classList.add("correct"); fb.className="erro";
    titulo=TXT.bad+" "+q.options[q.correctAnswer];
  }
  if(window.Estudo) Estudo.registrarResposta(q, selected===q.correctAnswer);
  fb.innerHTML='<div class="fb-titulo"></div><div class="fb-texto"></div>';
  fb.querySelector(".fb-titulo").textContent=titulo;
  fb.querySelector(".fb-texto").textContent=q.explanation||"";
  const next=document.getElementById("next-btn");
  next.textContent = currentQuestion+1<quiz.length ? TXT.next : TXT.finish;
  next.style.display="block";
  next.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function nextQuestion(){
  currentQuestion++;
  if(currentQuestion<quiz.length){ loadQuestion(); window.scrollTo({top:0,behavior:"smooth"}); }
  else showResult();
}

function showResult(){
  const n=quiz.length, pct=score/n;
  document.getElementById("progress").style.width="100%";
  document.getElementById("progress-text").textContent="";
  document.getElementById("question-container").textContent=TXT.final;
  document.getElementById("options-container").innerHTML="";
  const fb=document.getElementById("feedback"); fb.className=""; fb.innerHTML="";
  document.getElementById("next-btn").style.display="none";
  let best=score;
  if(window.Estudo) best=Estudo.salvarNota(score,n).melhor;
  const r=document.getElementById("result");
  r.innerHTML="";
  const a=document.createElement("span"); a.textContent=scoreText(score,n);
  const m=document.createElement("span"); m.className="msg"; m.textContent= pct>=0.8?TXT.m1 : pct>=0.6?TXT.m2 : TXT.m3;
  const b=document.createElement("span"); b.className="best"; b.textContent=TXT.best+" "+best+"/"+n;
  r.append(a,m,b);
  if(window.Estudo && Estudo.erros().length){
    const rv=document.createElement("a"); rv.href="revisao.html"; rv.className="btn-revisar";
    rv.textContent="📌 Repasar mis errores ("+Estudo.erros().length+")";
    r.appendChild(rv);
  }
  if(window.Estudo) Estudo.oferta(r, pct);
  document.getElementById("restart-btn").style.display="inline-block";
  try{ const g=(typeof gtag==="function")?gtag:(window.parent&&window.parent.gtag); if(g) g("event","simulado_concluido",{simulado:document.title,acertos:score,total:n}); }catch(e){}
}

document.getElementById("next-btn").onclick=nextQuestion;
document.getElementById("restart-btn").onclick=function(){
  this.style.display="none"; prepareQuiz(); loadQuestion();
};

prepareQuiz();
loadQuestion();

</script>
</body>
</html>
