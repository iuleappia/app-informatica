<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redes de Computadores</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:linear-gradient(135deg,#4CAF50,#2E7D32);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

#main-wrapper{
width:95%;
max-width:650px;
}

#quiz-container{
background:#fff;
padding:25px;
border-radius:16px;
box-shadow:0 15px 40px rgba(0,0,0,0.2);
text-align:center;
animation:fadeIn .4s;
}

h2{
margin-bottom:10px;
color:#2E7D32;
}

#progress-text{
margin-bottom:10px;
font-size:14px;
color:#555;
}

#progress-bar{
width:100%;
height:10px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin-bottom:20px;
}

#progress{
height:100%;
width:0%;
background:#4CAF50;
transition:.3s;
}

#question-container{
font-weight:bold;
margin-bottom:20px;
}

#options-container{
display:grid;
grid-template-columns:1fr;
gap:10px;
}

.option{
width:100%;
background:#4CAF50;
color:#fff;
padding:14px;
border:none;
border-radius:8px;
cursor:pointer;
transition:.3s;
font-size:16px;
}

.option:hover{
background:#388E3C;
transform:scale(1.02);
}

.option:disabled{
opacity:.7;
cursor:not-allowed;
}

.correct{
background:#2E7D32!important;
}

.wrong{
background:#C62828!important;
}

#result{
margin-top:15px;
font-weight:bold;
}

#restart-btn{
margin-top:20px;
padding:12px 20px;
border:none;
background:#2E7D32;
color:white;
border-radius:8px;
cursor:pointer;
font-size:16px;
display:none;
}

#restart-btn:hover{
background:#1B5E20;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:translateY(0);}
}

@media(min-width:600px){
#options-container{
grid-template-columns:1fr 1fr;
}
}


/* === MELHORIAS: feedback, próxima, voltar === */
.btn-voltar{display:inline-block;margin-bottom:12px;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;padding:10px 14px;border-radius:8px;background:rgba(255,255,255,0.18);}
.btn-voltar:hover{background:rgba(255,255,255,0.3);}
body{align-items:flex-start!important;}
#main-wrapper{margin:auto;padding:16px 0;}
.option:disabled{transform:none;}
.option:disabled:not(.correct):not(.wrong){background:#b0b7b0;}
.option.correct:disabled,.option.wrong:disabled{opacity:1;}
.option.correct:disabled::before{content:"✔ ";}
.option.wrong:disabled::before{content:"✖ ";}
#question-container{line-height:1.4;}
#feedback{display:none;margin-top:16px;text-align:left;border-radius:10px;padding:14px 16px;font-size:15px;line-height:1.5;animation:fadeIn .3s;}
#feedback.ok{display:block;background:#e8f5e9;border-left:5px solid #2E7D32;}
#feedback.erro{display:block;background:#ffebee;border-left:5px solid #C62828;}
#feedback .fb-titulo{font-weight:bold;margin-bottom:6px;color:#222;}
#feedback .fb-texto{color:#444;}
#next-btn{display:none;margin-top:14px;width:100%;padding:13px;border:none;border-radius:8px;background:#1565C0;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;}
#next-btn:hover{background:#0D47A1;}
#result .msg{display:block;margin-top:8px;font-weight:normal;color:#444;}
#result .btn-revisar{display:block;margin:16px auto 0;max-width:320px;padding:12px;border-radius:8px;background:#f59e0b;color:#fff;text-decoration:none;font-weight:bold;}
#result .best{display:block;margin-top:6px;font-size:13px;font-weight:normal;color:#777;}

</style>
<script src="../js/estudo.js"></script>
<link rel="stylesheet" href="../css/escuro.css">
<script src="../js/tema.js"></script>
</head>

<body>

<div id="main-wrapper">

<a href="../page/simulados.html" class="btn-voltar" onclick="if(history.length>1){history.back();return false;}">← Voltar</a>


<div id="quiz-container">

<h2>Redes de Computadores</h2>

<div id="progress-text"></div>

<div id="progress-bar">
<div id="progress"></div>
</div>

<div id="question-container"></div>

<div id="options-container"></div>

<div id="feedback"></div>

<button id="next-btn"></button>

<p id="result"></p>

<button id="restart-btn">Refazer Simulado</button>

</div>

</div>

<script>

const questions = [
  {
    question: "Qual é a função do protocolo TCP?",
    options: ["Transferir arquivos","Enviar e-mails","Transferir dados de forma confiável","Navegar na web"],
    correctAnswer: 2,
    explanation: "O TCP garante entrega confiável: numera os pacotes, confirma o recebimento e retransmite os perdidos."
  },
  {
    question: "O que significa o acrônimo \"IP\"?",
    options: ["Internet Protocol","Internal Protocol","Intranet Port","Internet Port"],
    correctAnswer: 0,
    explanation: "IP = Internet Protocol, responsável pelo endereçamento e pelo encaminhamento dos pacotes na rede."
  },
  {
    question: "Qual é o propósito do DNS em uma rede?",
    options: ["Atribuir endereços IP","Traduzir nomes de domínio em endereços IP","Encaminhar pacotes de dados","Criptografar dados"],
    correctAnswer: 1,
    explanation: "O DNS funciona como uma agenda da internet: converte nomes de domínio em endereços IP."
  },
  {
    question: "O que é um firewall?",
    options: ["Software de antivírus","Sistema (hardware ou software) que bloqueia tráfego não autorizado","Protocolo de comunicação","Software de gerenciamento de rede"],
    correctAnswer: 1,
    explanation: "Firewall é um sistema de segurança, em hardware ou software, que filtra o tráfego e bloqueia acessos não autorizados."
  },
  {
    question: "Qual é a função do roteador em uma rede?",
    options: ["Conectar dispositivos na mesma sub-rede","Encaminhar pacotes entre redes diferentes","Filtrar spam de e-mails","Gerenciar servidores de arquivos"],
    correctAnswer: 1,
    explanation: "O roteador interliga redes diferentes (ex.: sua casa e a internet) e escolhe o caminho dos pacotes até o destino."
  },
  {
    question: "O que é um endereço MAC?",
    options: ["Um endereço IP estático","Um identificador único para dispositivos de rede","Um protocolo de comunicação","Um tipo de firewall"],
    correctAnswer: 1,
    explanation: "O endereço MAC é o identificador físico da placa de rede, definido pelo fabricante."
  },
  {
    question: "O que significa a sigla \"LAN\"?",
    options: ["Local Area Network","Long-range Area Network","Large Array Network","Low-latency Access Network"],
    correctAnswer: 0,
    explanation: "LAN = Local Area Network, rede local de área limitada, como casa, escritório ou escola."
  },
  {
    question: "O que é um ataque de negação de serviço (DDoS)?",
    options: ["Um ataque que tenta roubar informações confidenciais","Um ataque que sobrecarrega um sistema tornando-o inacessível","Um ataque de vírus de computador","Um ataque que tenta modificar dados em trânsito"],
    correctAnswer: 1,
    explanation: "DDoS usa muitos dispositivos ao mesmo tempo para inundar um servidor de requisições até deixá-lo inacessível."
  },
  {
    question: "Qual é a diferença entre IPv4 e IPv6?",
    options: ["IPv4 usa endereços de 32 bits, enquanto IPv6 usa endereços de 128 bits","IPv4 é mais recente que IPv6","IPv4 é mais seguro que IPv6","IPv4 não suporta comunicação sem fio"],
    correctAnswer: 0,
    explanation: "IPv4 tem 32 bits (ex.: 192.168.0.1). IPv6 tem 128 bits, escrito em hexadecimal (ex.: 2001:db8::1), com muito mais endereços."
  },
  {
    question: "O que é um proxy?",
    options: ["Um tipo de firewall","Um servidor que encaminha solicitações entre o cliente e o servidor","Um protocolo de segurança","Um tipo de vírus de computador"],
    correctAnswer: 1,
    explanation: "O proxy é um intermediário: recebe as requisições do cliente e as repassa ao servidor. Pode filtrar acessos, fazer cache e ocultar o IP."
  },
  {
    question: "Qual é a função do protocolo ICMP?",
    options: ["Encaminhar pacotes entre redes","Verificar a disponibilidade de um host na rede","Criptografar comunicações","Atribuir endereços IP dinamicamente"],
    correctAnswer: 1,
    explanation: "ICMP envia mensagens de controle e erro. O ping usa ICMP para testar se um host está acessível."
  },
  {
    question: "O que é NAT (Network Address Translation)?",
    options: ["Um protocolo de segurança","Um tipo de endereço IP","Um método para mapear endereços IP privados para um único endereço IP público","Um tipo de cabo de rede"],
    correctAnswer: 2,
    explanation: "NAT permite que vários dispositivos com IP privado compartilhem um único IP público para acessar a internet."
  },
  {
    question: "O que é um protocolo de roteamento?",
    options: ["Um protocolo para transferir arquivos","Um conjunto de regras para comunicação segura","Um protocolo para encaminhar pacotes entre redes","Um protocolo de criptografia"],
    correctAnswer: 2,
    explanation: "Protocolos de roteamento (RIP, OSPF, BGP) definem como os roteadores trocam informações para escolher os caminhos dos pacotes entre redes."
  },
  {
    question: "O que é SSL/TLS?",
    options: ["Um protocolo para transferência de arquivos","Um protocolo de segurança para comunicação na web","Um tipo de endereço IP","Um protocolo de firewall"],
    correctAnswer: 1,
    explanation: "SSL/TLS criptografa os dados trocados entre navegador e servidor, protegendo senhas e pagamentos (HTTPS)."
  },
  {
    question: "Qual é a principal função de um switch em uma rede?",
    options: ["Encaminhar pacotes entre redes","Conectar dispositivos na mesma sub-rede","Controlar o acesso à internet","Bloquear tráfego não autorizado"],
    correctAnswer: 1,
    explanation: "O switch conecta dispositivos da mesma rede local e encaminha os dados só para a porta de destino, usando o endereço MAC."
  },
  {
    question: "O que é um ataque de phishing?",
    options: ["Um ataque que tenta sobrecarregar um sistema","Um ataque que rouba informações confidenciais enganando o usuário","Um tipo de firewall","Um protocolo de criptografia"],
    correctAnswer: 1,
    explanation: "Phishing usa mensagens ou sites falsos que imitam empresas reais para enganar a vítima e roubar senhas e dados."
  },
  {
    question: "O que é um endereço IP privado?",
    options: ["Um endereço IP atribuído a um servidor web","Um endereço IP que não pode ser acessado pela internet","Um endereço IP atribuído a um dispositivo móvel","Um endereço IP estático"],
    correctAnswer: 1,
    explanation: "IPs privados (10.x.x.x, 172.16–31.x.x, 192.168.x.x) são usados em redes internas e não são roteados diretamente na internet."
  },
  {
    question: "Qual é a diferença entre UDP e TCP?",
    options: ["UDP é mais seguro que TCP","TCP é orientado à conexão, enquanto UDP é orientado à não conexão","UDP é usado apenas para transferência de arquivos","TCP não é adequado para redes de grande escala"],
    correctAnswer: 1,
    explanation: "TCP estabelece conexão e garante a entrega. UDP envia sem conexão: é mais rápido, ideal para streaming, jogos e chamadas."
  },
  {
    question: "O que é um VLAN?",
    options: ["Um tipo de endereço IP","Um protocolo de segurança","Uma rede local virtual que segmenta uma rede física em redes lógicas","Um tipo de cabo de rede"],
    correctAnswer: 2,
    explanation: "VLAN (Virtual LAN) divide logicamente uma rede física em redes separadas, melhorando a segurança e a organização."
  },
  {
    question: "O que é um gateway?",
    options: ["Um dispositivo que conecta redes diferentes","Um tipo de protocolo de segurança","Um tipo de vírus de computador","Um protocolo de criptografia"],
    correctAnswer: 0,
    explanation: "Gateway é o ponto de ligação entre redes diferentes. Em casa, o roteador é o gateway padrão para a internet."
  }
];

/* ===== Lógica do simulado =====
   - alternativas e perguntas embaralhadas a cada tentativa
   - explicação após cada resposta + botão de próxima
   - melhor nota salva no aparelho */
const TXT = {"q":"Pergunta","of":"de","ok":"✅ Correto!","bad":"❌ Incorreto. Resposta certa:","next":"Próxima pergunta ▶","finish":"Ver resultado 🏁","final":"Resultado final","best":"Sua melhor nota neste simulado:","m1":"🏆 Excelente! Você domina este conteúdo.","m2":"👍 Bom resultado! Revise os pontos que errou.","m3":"📚 Continue estudando: releia a disciplina e tente de novo."};
function scoreText(s, n){ return `Você acertou ${s} de ${n} perguntas (${Math.round(s / n * 100)}%)`; }

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

let quiz=[], currentQuestion=0, score=0;

function prepareQuiz(){
  quiz = shuffle(questions.map(q => {
    const opts = shuffle(q.options.map((text,i) => ({ text, ok: i === q.correctAnswer })));
    return { question:q.question, options:opts.map(o=>o.text), correctAnswer:opts.findIndex(o=>o.ok), explanation:q.explanation };
  }));
  currentQuestion=0; score=0;
}

function loadQuestion(){
  const q = quiz[currentQuestion];
  document.getElementById("progress-text").textContent = TXT.q+" "+(currentQuestion+1)+" "+TXT.of+" "+quiz.length;
  document.getElementById("progress").style.width = (currentQuestion/quiz.length*100)+"%";
  document.getElementById("question-container").textContent = q.question;
  const fb = document.getElementById("feedback"); fb.className=""; fb.innerHTML="";
  document.getElementById("next-btn").style.display="none";
  document.getElementById("result").innerHTML="";
  const box = document.getElementById("options-container");
  box.innerHTML="";
  q.options.forEach((option,index) => {
    const b=document.createElement("button");
    b.textContent=option; b.className="option"; b.dataset.index=index; b.onclick=selectOption;
    box.appendChild(b);
  });
}

function selectOption(event){
  const q = quiz[currentQuestion];
  const buttons=document.querySelectorAll(".option");
  buttons.forEach(b=>b.disabled=true);
  const selected=parseInt(event.currentTarget.dataset.index,10);
  const fb=document.getElementById("feedback");
  let titulo;
  if(selected===q.correctAnswer){
    event.currentTarget.classList.add("correct"); score++; fb.className="ok"; titulo=TXT.ok;
  }else{
    event.currentTarget.classList.add("wrong"); buttons[q.correctAnswer].classList.add("correct"); fb.className="erro";
    titulo=TXT.bad+" "+q.options[q.correctAnswer];
  }
  if(window.Estudo) Estudo.registrarResposta(q, selected===q.correctAnswer);
  fb.innerHTML='<div class="fb-titulo"></div><div class="fb-texto"></div>';
  fb.querySelector(".fb-titulo").textContent=titulo;
  fb.querySelector(".fb-texto").textContent=q.explanation||"";
  const next=document.getElementById("next-btn");
  next.textContent = currentQuestion+1<quiz.length ? TXT.next : TXT.finish;
  next.style.display="block";
  next.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function nextQuestion(){
  currentQuestion++;
  if(currentQuestion<quiz.length){ loadQuestion(); window.scrollTo({top:0,behavior:"smooth"}); }
  else showResult();
}

function showResult(){
  const n=quiz.length, pct=score/n;
  document.getElementById("progress").style.width="100%";
  document.getElementById("progress-text").textContent="";
  document.getElementById("question-container").textContent=TXT.final;
  document.getElementById("options-container").innerHTML="";
  const fb=document.getElementById("feedback"); fb.className=""; fb.innerHTML="";
  document.getElementById("next-btn").style.display="none";
  let best=score;
  if(window.Estudo) best=Estudo.salvarNota(score,n).melhor;
  const r=document.getElementById("result");
  r.innerHTML="";
  const a=document.createElement("span"); a.textContent=scoreText(score,n);
  const m=document.createElement("span"); m.className="msg"; m.textContent= pct>=0.8?TXT.m1 : pct>=0.6?TXT.m2 : TXT.m3;
  const b=document.createElement("span"); b.className="best"; b.textContent=TXT.best+" "+best+"/"+n;
  r.append(a,m,b);
  if(window.Estudo && Estudo.erros().length){
    const rv=document.createElement("a"); rv.href="revisao.html"; rv.className="btn-revisar";
    rv.textContent="📌 Revisar meus erros ("+Estudo.erros().length+")";
    r.appendChild(rv);
  }
  if(window.Estudo) Estudo.oferta(r, pct);
  document.getElementById("restart-btn").style.display="inline-block";
  try{ const g=(typeof gtag==="function")?gtag:(window.parent&&window.parent.gtag); if(g) g("event","simulado_concluido",{simulado:document.title,acertos:score,total:n}); }catch(e){}
}

document.getElementById("next-btn").onclick=nextQuestion;
document.getElementById("restart-btn").onclick=function(){
  this.style.display="none"; prepareQuiz(); loadQuestion();
};

prepareQuiz();
loadQuestion();

</script>

</body>
</html>
