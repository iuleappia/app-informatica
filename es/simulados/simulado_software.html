<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Software</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;}
body{background:linear-gradient(135deg,#4CAF50,#2E7D32);min-height:100vh;display:flex;justify-content:center;align-items:center;}
#main-wrapper{width:95%;max-width:650px;}
#quiz-container{background:#fff;padding:25px;border-radius:16px;box-shadow:0 15px 40px rgba(0,0,0,0.2);text-align:center;animation:fadeIn .4s;}
h2{margin-bottom:10px;color:#2E7D32;}
#progress-text{margin-bottom:10px;font-size:14px;color:#555;}
#progress-bar{width:100%;height:10px;background:#ddd;border-radius:20px;overflow:hidden;margin-bottom:20px;}
#progress{height:100%;width:0%;background:#4CAF50;transition:.3s;}
#question-container{font-weight:bold;margin-bottom:20px;}
#options-container{display:grid;grid-template-columns:1fr;gap:10px;}
.option{width:100%;background:#4CAF50;color:#fff;padding:14px;border:none;border-radius:8px;cursor:pointer;transition:.3s;font-size:16px;}
.option:hover{background:#388E3C;transform:scale(1.02);}
.option:disabled{opacity:.7;cursor:not-allowed;}
.correct{background:#2E7D32!important;}
.wrong{background:#C62828!important;}
#result{margin-top:15px;font-weight:bold;}
#restart-btn{margin-top:20px;padding:12px 20px;border:none;background:#2E7D32;color:white;border-radius:8px;cursor:pointer;font-size:16px;display:none;}
#restart-btn:hover{background:#1B5E20;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@media(min-width:600px){#options-container{grid-template-columns:1fr 1fr;}}

/* === MELHORIAS: feedback, próxima, voltar === */
.btn-voltar{display:inline-block;margin-bottom:12px;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;padding:10px 14px;border-radius:8px;background:rgba(255,255,255,0.18);}
.btn-voltar:hover{background:rgba(255,255,255,0.3);}
body{align-items:flex-start!important;}
#main-wrapper{margin:auto;padding:16px 0;}
.option:disabled{transform:none;}
.option:disabled:not(.correct):not(.wrong){background:#b0b7b0;}
.option.correct:disabled,.option.wrong:disabled{opacity:1;}
.option.correct:disabled::before{content:"✔ ";}
.option.wrong:disabled::before{content:"✖ ";}
#question-container{line-height:1.4;}
#feedback{display:none;margin-top:16px;text-align:left;border-radius:10px;padding:14px 16px;font-size:15px;line-height:1.5;animation:fadeIn .3s;}
#feedback.ok{display:block;background:#e8f5e9;border-left:5px solid #2E7D32;}
#feedback.erro{display:block;background:#ffebee;border-left:5px solid #C62828;}
#feedback .fb-titulo{font-weight:bold;margin-bottom:6px;color:#222;}
#feedback .fb-texto{color:#444;}
#next-btn{display:none;margin-top:14px;width:100%;padding:13px;border:none;border-radius:8px;background:#1565C0;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;}
#next-btn:hover{background:#0D47A1;}
#result .msg{display:block;margin-top:8px;font-weight:normal;color:#444;}
#result .btn-revisar{display:block;margin:16px auto 0;max-width:320px;padding:12px;border-radius:8px;background:#f59e0b;color:#fff;text-decoration:none;font-weight:bold;}
#result .best{display:block;margin-top:6px;font-size:13px;font-weight:normal;color:#777;}

</style>
<script src="../../js/estudo.js"></script>
<link rel="stylesheet" href="../../css/escuro.css">
<script src="../../js/tema.js"></script>
</head>
<body>
<div id="main-wrapper">

<a href="../simulados.html" class="btn-voltar" onclick="if(history.length>1){history.back();return false;}">← Volver</a>

<div id="quiz-container">
<h2>Software</h2>
<div id="progress-text"></div>
<div id="progress-bar"><div id="progress"></div></div>
<div id="question-container"></div>
<div id="options-container"></div>

<div id="feedback"></div>

<button id="next-btn"></button>
<p id="result"></p>
<button id="restart-btn">Repetir Simulacro</button>
</div>
</div>
<script>
const questions = [
  {
    question: "¿Qué es un software?",
    options: ["Un dispositivo de hardware","Un conjunto de instrucciones para la computadora","Un tipo de almacenamiento de datos","Una interfaz gráfica"],
    correctAnswer: 1,
    explanation: "El software es la parte lógica de la computadora: programas e instrucciones que le dicen al hardware qué hacer."
  },
  {
    question: "¿Cuál es la diferencia entre software de código abierto y software propietario?",
    options: ["El precio de adquisición","El acceso al código fuente","La facilidad de uso","La velocidad de procesamiento"],
    correctAnswer: 1,
    explanation: "En el software de código abierto (Linux, LibreOffice) el código fuente es público. En el propietario (Windows, Office) el código es cerrado."
  },
  {
    question: "¿Qué es un sistema operativo?",
    options: ["Un programa antivirus","Un software de edición de texto","Un software que gestiona el hardware y los demás programas","Un software de diseño gráfico"],
    correctAnswer: 2,
    explanation: "El sistema operativo es el software básico que gestiona el hardware y sirve de base para los demás programas (Windows, Linux, Android)."
  },
  {
    question: "¿Cuál es la función de un compilador en el desarrollo de software?",
    options: ["Ejecutar programas","Convertir código fuente en código de máquina","Crear interfaces gráficas","Detectar virus en el código"],
    correctAnswer: 1,
    explanation: "El compilador traduce todo el código fuente a código máquina (o ejecutable) antes de ejecutarlo. El intérprete traduce línea por línea."
  },
  {
    question: "¿Qué son los lenguajes de programación de alto nivel?",
    options: ["Lenguajes difíciles de aprender","Lenguajes que se comunican con el hardware directamente","Lenguajes más cercanos al lenguaje humano","Lenguajes usados solo para juegos"],
    correctAnswer: 2,
    explanation: "Los lenguajes de alto nivel (Python, Java, C#) usan comandos cercanos al lenguaje humano, más fáciles de leer y escribir."
  },
  {
    question: "¿Qué significa UX en diseño de software?",
    options: ["User Experience","User Execution","User Exception","User Expansion"],
    correctAnswer: 0,
    explanation: "UX = User Experience: la experiencia del usuario, es decir, qué tan fácil, agradable y eficiente es usar el software."
  },
  {
    question: "¿Qué es una base de datos?",
    options: ["Un dispositivo de almacenamiento físico","Un software de edición de imágenes","Un conjunto de datos organizados","Una forma de hardware de comunicación"],
    correctAnswer: 2,
    explanation: "Una base de datos es un conjunto organizado de datos, generalmente gestionado por un SGBD (MySQL, Oracle, SQL Server)."
  },
  {
    question: "¿Qué son las APIs (Interfaces de Programación de Aplicaciones)?",
    options: ["Algoritmos complejos","Módulos de software preinstalados","Conjuntos de instrucciones de hardware","Conjuntos de reglas para la interacción entre software"],
    correctAnswer: 3,
    explanation: "Las API definen cómo se comunican e intercambian datos programas diferentes."
  },
  {
    question: "¿Qué es el debugging en programación?",
    options: ["Un tipo de lenguaje de programación","El proceso de eliminar errores de un programa","Un método de programación rápida","Un tipo de hardware especializado"],
    correctAnswer: 1,
    explanation: "El debugging (depuración) consiste en localizar y corregir bugs (errores) en el código."
  },
  {
    question: "¿Qué es la nube (cloud) en el contexto del software?",
    options: ["Un tipo de software antivirus","Un tipo de sistema operativo","Un modelo de distribución de servicios por internet","Un tipo de almacenamiento externo"],
    correctAnswer: 2,
    explanation: "La computación en la nube ofrece servidores, almacenamiento y programas por internet, bajo demanda (ej.: Google Drive, AWS)."
  },
  {
    question: "¿Cuál es la diferencia entre software y firmware?",
    options: ["El software se almacena en hardware, el firmware en software","El software es de código abierto, el firmware es propietario","El software es fácilmente modificable, el firmware es difícil de modificar","El software es temporal, el firmware es permanente"],
    correctAnswer: 2,
    explanation: "El firmware es software grabado en el propio hardware (BIOS, router) y es difícil de modificar. El software común se instala y modifica fácilmente."
  },
  {
    question: "¿Qué es un algoritmo en programación?",
    options: ["Un tipo de hardware","Un conjunto de instrucciones específicas","Un método de resolución de problemas","Un tipo de interfaz gráfica"],
    correctAnswer: 2,
    explanation: "Un algoritmo es un método, una secuencia de pasos para resolver un problema. El programa es su implementación en un lenguaje."
  },
  {
    question: "¿Qué significa IoT (Internet of Things)?",
    options: ["Internet Offline Transfer","Internet of Telecommunications","Internet of Things","Internet Over Time"],
    correctAnswer: 2,
    explanation: "IoT = Internet of Things (Internet de las Cosas): objetos cotidianos conectados a internet, como lámparas, relojes y sensores."
  },
  {
    question: "¿Qué es el versionado de software?",
    options: ["Un método de seguimiento de versiones antiguas de software","Un tipo de software de edición de video","Un método de desarrollo de software","Un proceso de control de cambios en software"],
    correctAnswer: 3,
    explanation: "El control de versiones (por ejemplo, Git) registra los cambios del software a lo largo del tiempo y permite volver a versiones anteriores."
  },
  {
    question: "¿Qué es la criptografía en software?",
    options: ["Un método de compresión de datos","Un tipo de lenguaje de programación","Un método de codificación de datos para seguridad","Un tipo de algoritmo de inteligencia artificial"],
    correctAnswer: 2,
    explanation: "La criptografía codifica los datos para que solo quien tiene la clave pueda leerlos, protegiendo contraseñas, mensajes y transacciones."
  },
  {
    question: "¿Qué son los frameworks en desarrollo de software?",
    options: ["Un tipo de sistema operativo","Un conjunto de bibliotecas y directrices para el desarrollo","Un tipo de software antivirus","Un método para probar software"],
    correctAnswer: 1,
    explanation: "Un framework es una base lista de bibliotecas y patrones que agiliza el desarrollo (ej.: React, Django, Laravel)."
  },
  {
    question: "¿Qué es DevOps en el contexto del desarrollo de software?",
    options: ["Un tipo de lenguaje de programación","Un conjunto de prácticas para integración de desarrollo y operaciones","Un modelo de distribución de software","Un tipo de sistema operativo"],
    correctAnswer: 1,
    explanation: "DevOps integra a los equipos de desarrollo y operaciones con automatización y entrega continua."
  },
  {
    question: "¿Qué es Scrum en gestión de proyectos de software?",
    options: ["Un tipo de software antivirus","Un método de desarrollo ágil","Un modelo de distribución de servicios","Un tipo de lenguaje de programación"],
    correctAnswer: 1,
    explanation: "Scrum es un marco ágil: el trabajo se divide en sprints cortos, con roles (Product Owner, Scrum Master, equipo) y reuniones regulares."
  },
  {
    question: "¿Qué es machine learning en software?",
    options: ["Un tipo de software antivirus","Un método de enseñanza de programación a máquinas","Una rama de la inteligencia artificial que permite que el software aprenda de los datos","Un tipo de sistema operativo"],
    correctAnswer: 2,
    explanation: "El machine learning es una rama de la IA en la que el sistema aprende patrones a partir de datos, sin programar regla por regla."
  },
  {
    question: "¿Qué es la refactorización de código?",
    options: ["Un método de compilación de código","Un proceso de optimización y reestructuración del código fuente sin alterar su comportamiento externo","Un tipo de lenguaje de programación","Un método de prueba de software"],
    correctAnswer: 1,
    explanation: "Refactorizar es mejorar la estructura interna del código (legibilidad, organización) sin cambiar lo que hace para el usuario."
  }
];

/* ===== Lógica do simulado =====
   - alternativas e perguntas embaralhadas a cada tentativa
   - explicação após cada resposta + botão de próxima
   - melhor nota salva no aparelho */
const TXT = {"q":"Pregunta","of":"de","ok":"✅ ¡Correcto!","bad":"❌ Incorrecto. Respuesta correcta:","next":"Siguiente pregunta ▶","finish":"Ver resultado 🏁","final":"Resultado final","best":"Tu mejor nota en este simulacro:","m1":"🏆 ¡Excelente! Dominas este contenido.","m2":"👍 ¡Buen resultado! Repasa los puntos que fallaste.","m3":"📚 Sigue estudiando: vuelve a leer la materia e inténtalo de nuevo."};
function scoreText(s, n){ return `Acertaste ${s} de ${n} preguntas (${Math.round(s / n * 100)}%)`; }

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

let quiz=[], currentQuestion=0, score=0;

function prepareQuiz(){
  quiz = shuffle(questions.map(q => {
    const opts = shuffle(q.options.map((text,i) => ({ text, ok: i === q.correctAnswer })));
    return { question:q.question, options:opts.map(o=>o.text), correctAnswer:opts.findIndex(o=>o.ok), explanation:q.explanation };
  }));
  currentQuestion=0; score=0;
}

function loadQuestion(){
  const q = quiz[currentQuestion];
  document.getElementById("progress-text").textContent = TXT.q+" "+(currentQuestion+1)+" "+TXT.of+" "+quiz.length;
  document.getElementById("progress").style.width = (currentQuestion/quiz.length*100)+"%";
  document.getElementById("question-container").textContent = q.question;
  const fb = document.getElementById("feedback"); fb.className=""; fb.innerHTML="";
  document.getElementById("next-btn").style.display="none";
  document.getElementById("result").innerHTML="";
  const box = document.getElementById("options-container");
  box.innerHTML="";
  q.options.forEach((option,index) => {
    const b=document.createElement("button");
    b.textContent=option; b.className="option"; b.dataset.index=index; b.onclick=selectOption;
    box.appendChild(b);
  });
}

function selectOption(event){
  const q = quiz[currentQuestion];
  const buttons=document.querySelectorAll(".option");
  buttons.forEach(b=>b.disabled=true);
  const selected=parseInt(event.currentTarget.dataset.index,10);
  const fb=document.getElementById("feedback");
  let titulo;
  if(selected===q.correctAnswer){
    event.currentTarget.classList.add("correct"); score++; fb.className="ok"; titulo=TXT.ok;
  }else{
    event.currentTarget.classList.add("wrong"); buttons[q.correctAnswer].classList.add("correct"); fb.className="erro";
    titulo=TXT.bad+" "+q.options[q.correctAnswer];
  }
  if(window.Estudo) Estudo.registrarResposta(q, selected===q.correctAnswer);
  fb.innerHTML='<div class="fb-titulo"></div><div class="fb-texto"></div>';
  fb.querySelector(".fb-titulo").textContent=titulo;
  fb.querySelector(".fb-texto").textContent=q.explanation||"";
  const next=document.getElementById("next-btn");
  next.textContent = currentQuestion+1<quiz.length ? TXT.next : TXT.finish;
  next.style.display="block";
  next.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function nextQuestion(){
  currentQuestion++;
  if(currentQuestion<quiz.length){ loadQuestion(); window.scrollTo({top:0,behavior:"smooth"}); }
  else showResult();
}

function showResult(){
  const n=quiz.length, pct=score/n;
  document.getElementById("progress").style.width="100%";
  document.getElementById("progress-text").textContent="";
  document.getElementById("question-container").textContent=TXT.final;
  document.getElementById("options-container").innerHTML="";
  const fb=document.getElementById("feedback"); fb.className=""; fb.innerHTML="";
  document.getElementById("next-btn").style.display="none";
  let best=score;
  if(window.Estudo) best=Estudo.salvarNota(score,n).melhor;
  const r=document.getElementById("result");
  r.innerHTML="";
  const a=document.createElement("span"); a.textContent=scoreText(score,n);
  const m=document.createElement("span"); m.className="msg"; m.textContent= pct>=0.8?TXT.m1 : pct>=0.6?TXT.m2 : TXT.m3;
  const b=document.createElement("span"); b.className="best"; b.textContent=TXT.best+" "+best+"/"+n;
  r.append(a,m,b);
  if(window.Estudo && Estudo.erros().length){
    const rv=document.createElement("a"); rv.href="revisao.html"; rv.className="btn-revisar";
    rv.textContent="📌 Repasar mis errores ("+Estudo.erros().length+")";
    r.appendChild(rv);
  }
  if(window.Estudo) Estudo.oferta(r, pct);
  document.getElementById("restart-btn").style.display="inline-block";
  try{ const g=(typeof gtag==="function")?gtag:(window.parent&&window.parent.gtag); if(g) g("event","simulado_concluido",{simulado:document.title,acertos:score,total:n}); }catch(e){}
}

document.getElementById("next-btn").onclick=nextQuestion;
document.getElementById("restart-btn").onclick=function(){
  this.style.display="none"; prepareQuiz(); loadQuestion();
};

prepareQuiz();
loadQuestion();

</script>
</body>
</html>
